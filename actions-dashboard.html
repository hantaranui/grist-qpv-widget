<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actions d'insertion par le sport</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://hantaranui.github.io/Bandeau_France-Travail/bandeau.js" data-titre="Liste des actions"></script>
    <link href="https://cdn.francetravail.fr/studio/design-system/css/styles.css" rel="stylesheet">
    <script src="https://cdn.francetravail.fr/webco/v1/ft-autoloader.js" fetchpriority="high"></script>
    <style>
:root {
  color-scheme: light;
  /* Variables officielles du Design System France Travail. */
  --font-title: Marianne, Helvetica, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Marianne, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
  --radius-control: var(--ft--button-border-radius-sm);
  --radius-surface: var(--ft--button-border-radius);
  /* Hauteur utile laissee au tableau : tout ce qui le precede dans la page
     (topbar, marges du layout, entete de la synthese repliee). */
  /* Largeur plancher d'une colonne de filtre. Le plus long libelle,
     « Direction departementale (DD) », mesure 212 px en 14px/700 : en dessous
     de ce plancher le titre se couperait en deux lignes. On garde une marge
     pour les variantes de police (Segoe UI sous Windows). */
  --filter-col: 230px;
  --brand-navy: var(--ft--color-primary);
  --brand-blue: var(--ft--icon-info);
  --brand-pink: var(--ft--bg-info);
  --brand-yellow: var(--ft--bg-warning);
  --brand-red: var(--ft--icon-error);
  --bg: var(--ft--color-background-neutral-default-weakest);
  --panel: var(--ft-color-background-layout-body);
  --panel-soft: var(--ft--color-background-primary-weakest);
  --ink: var(--ft--color-text-color);
  --muted: var(--ft--color-background-neutral-default-strong);
  --line: var(--ft--color-border-neutral-default-weaker);
  --focus: var(--ft--icon-info);
  --accent: var(--ft--color-primary);
  --blue: var(--ft--bg-info);
  --pink: var(--ft--bg-info);
  --yellow: var(--ft--bg-warning);
  --red: var(--ft--bg-error);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
}

button, select, input {
  font: inherit;
}

/* Le selecteur de public est un bouton qui tient lieu de champ : il porte
   form-control et doit donc etre habille par le design system comme les autres,
   sans quoi notre reglage de bouton lui imposait un texte plus grand. */
button:not(.btn):not(.form-control) {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.5;
}

button:disabled {
  font-style: italic;
}

button:not(.btn):not(.form-control), select, input { border-radius: var(--radius-control); }

button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid var(--ft--color-primary-20);
  outline-offset: 2px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.topbar-actions { display: flex; align-items: center; gap: 12px; }

h1 {
  margin: 0;
  padding-left: 16px;
  border-left: 4px solid var(--brand-blue);
  font-size: 28px;
  line-height: 1.15;
  font-family: var(--font-title);
}

/* La page occupe la hauteur de l'ecran et la distribue : le tableau recupere
   tout ce que l'en-tete et les bandeaux ne prennent pas, quelle que soit la
   taille de l'ecran. La fiche de detail est en position fixed, hors de ce flux. */
#dashboardView {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

/* Un selecteur d'identifiant l'emporte sur une classe : sans cette regle, le
   display: none de .is-hidden ne masquait pas le tableau de bord et la fiche
   s'ajoutait dessous au lieu de le remplacer. */
#dashboardView.is-hidden { display: none; }

.dashboard-layout {
  display: grid;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: none;
  margin: 0;
  /* 270px - 32px de padding = 238px utiles, soit le plus long libelle de filtre
     (212px) sans rupture de ligne. */
  grid-template-columns: 270px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  align-items: start;
  gap: 24px;
  padding: 24px;
}

/* La colonne des filtres garde la hauteur de son contenu, le contenu principal
   prend toute celle de la ligne. */
.dashboard-layout > main {
  align-self: stretch;
  min-height: 0;
}

/* Filtres replies : la colonne de gauche n'a plus de contenu a montrer, elle
   laisserait une bande vide sur un grand ecran. Le bandeau passe donc au-dessus,
   pleine largeur, et le tableau occupe tout l'espace. Deplier rend la colonne. */
.dashboard-layout.filters-collapsed {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
}

.filters, .board-section, .table-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-surface);
}

.board-section {
  overflow: hidden;
}

.board-section.is-collapsed {
  align-self: stretch;
  width: 100%;
  max-height: 40px;
  min-height: 0;
}

.board-section.is-collapsed .summary {
  display: none;
  height: 0;
  min-height: 0;
  overflow: hidden;
  padding: 0;
}

.board-section.is-collapsed .section-head {
  border-bottom: 0;
}

/* La zone des filtres se replie comme la synthese, mais garde ses controles dans
   le DOM : les valeurs choisies survivent au repliement. */
.filters.is-collapsed .filters-body {
  display: none;
}

.filters.is-collapsed > .section-head {
  border-bottom: 0;
}

/* Le titre et le bouton Reinitialiser vont ensemble a gauche, le bouton de
   repliement reste seul a droite. */
.section-head-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.filters > .section-head,
.board-section > .section-head,
.edit-card > .section-head {
  border-top-left-radius: calc(var(--radius-surface) - 1px);
  border-top-right-radius: calc(var(--radius-surface) - 1px);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 40px;
  padding: 0 16px;
  background: var(--ft--color-background-primary-weakest);
  border-bottom: 1px solid var(--line);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  font-family: var(--font-title);
}

.filters-body {
  display: grid;
  gap: 16px;
  padding: 18px 16px 20px;
}

/* Le titre d'un filtre ne se coupe jamais en milieu de libelle : si la place
   manque, c'est le bloc entier qui passe a la ligne suivante de la grille.
   Le nowrap est neutralise sur les enfants pour ne pas figer le select ni le
   menu de recherche. */
.filters-body > .filter-field {
  display: grid;
  gap: 8px;
  white-space: nowrap;
}

.filters-body > .filter-field > * {
  white-space: normal;
}

.filter-search-dropdown {
  position: relative;
  width: 100%;
}

/* Le resume porte form-control : il ne reste que ce que le design system ne dit
   pas d'un <summary>, sa disposition interne et le masquage du triangle natif. */
/* Nos deux controles qui tiennent lieu de liste deroulante portent l'indicateur
   exact du design system : l'image et les reglages sont repris tels quels de
   « select.form-control », car aucune classe ne les expose. Les icones de sa
   police ne conviennent pas — « chevron-up-down » est un double chevron la ou
   son select affiche deux triangles pleins. A rafraichir s'il change la sienne. */
.filter-search-dropdown summary,
.public-toggle {
  padding-right: 1.5rem;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZmlsbC1ydWxlPSJldmVub2RkIiBjbGlwLXJ1bGU9ImV2ZW5vZGQiIGQ9Ik01LjM1MTMyIDcuMTI2NDVDNS4yMTcxMyA2Ljg5NTIxIDUuMjE2MTcgNi42MTAwMiA1LjM0ODgyIDYuMzc3OUw3LjM0ODgyIDIuODc3OUM3LjQ4MjM1IDIuNjQ0MjEgNy43MzA4NiAyLjUgOCAyLjVDOC4yNjkxNCAyLjUgOC41MTc2NSAyLjY0NDIxIDguNjUxMTggMi44Nzc5TDEwLjY1MTIgNi4zNzc5QzEwLjc4MzggNi42MTAwMiAxMC43ODI5IDYuODk1MjEgMTAuNjQ4NyA3LjEyNjQ1QzEwLjUxNDUgNy4zNTc2OCAxMC4yNjc0IDcuNSAxMCA3LjVINkM1LjczMjY1IDcuNSA1LjQ4NTUxIDcuMzU3NjggNS4zNTEzMiA3LjEyNjQ1WiIgZmlsbD0iIzJFMkUzMSIvPgo8cGF0aCBmaWxsLXJ1bGU9ImV2ZW5vZGQiIGNsaXAtcnVsZT0iZXZlbm9kZCIgZD0iTTEwLjY0ODcgOS4zNzM1NUMxMC43ODI5IDkuNjA0NzkgMTAuNzgzOCA5Ljg4OTk4IDEwLjY1MTIgMTAuMTIyMUw4LjY1MTE4IDEzLjYyMjFDOC41MTc2NSAxMy44NTU4IDguMjY5MTQgMTQgOCAxNEM3LjczMDg2IDE0IDcuNDgyMzUgMTMuODU1OCA3LjM0ODgyIDEzLjYyMjFMNS4zNDg4MiAxMC4xMjIxQzUuMjE2MTcgOS44ODk5OCA1LjIxNzEzIDkuNjA0NzkgNS4zNTEzMiA5LjM3MzU1QzUuNDg1NTEgOS4xNDIzMiA1LjczMjY1IDkgNiA5SDEwQzEwLjI2NzQgOSAxMC41MTQ1IDkuMTQyMzIgMTAuNjQ4NyA5LjM3MzU1WiIgZmlsbD0iIzJFMkUzMSIvPgo8L3N2Zz4K");
  background-repeat: no-repeat;
  background-position: right .5rem center;
}

.filter-search-dropdown summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  list-style: none;
}

.filter-search-dropdown summary::-webkit-details-marker { display: none; }

.sort-menu { position: relative; }
.sort-menu summary { display: inline-flex; align-items: center; gap: 8px; min-height: var(--ft--table-th-height); cursor: pointer; list-style: none; }
.sort-menu summary::-webkit-details-marker { display: none; }
.sort-menu summary .icon { font-size: 14px; }
.sort-options { position: absolute; z-index: 20; top: calc(100% - 4px); left: 0; display: grid; min-width: 130px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--panel); box-shadow: 0 4px 12px var(--ft-color-background-opacity-dark-opacity); }
.sort-options button { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 400; text-align: left; }
.sort-options button:hover { background: var(--ft--color-background-neutral-default-weakest); }
.sort-options .icon { font-size: 14px; }

.filter-search-panel {
  position: absolute;
  z-index: 20;
  top: calc(100% + 4px);
  left: 0;
  width: 420px;
  max-width: calc(100vw - 48px);
  display: grid;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: var(--panel);
  box-shadow: 0 4px 12px var(--ft-color-background-opacity-dark-opacity);
}

.filter-text-control {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.filter-text-submit {
  flex: 0 0 auto;
  width: var(--ft--form-control-height);
  min-height: var(--ft--form-control-height);
  padding: 0;
}

/* Le champ partage sa ligne avec le bouton loupe : il prend la place restante. */
.filter-text-input { min-width: 0; }

.filter-search-options {
  display: grid;
  gap: 2px;
  max-height: 220px;
  overflow-y: auto;
}

.filter-search-option {
  display: block;
  width: 100%;
  height: auto;
  min-height: 32px;
  padding: 6px 8px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.35;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-search-option:hover,
.filter-search-option:focus-visible {
  background: var(--ft--color-background-primary-weakest);
}

.filters select,
.filters select option {
  font-family: var(--font-body);
  font-weight: 400 !important;
}

main {
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}

main > .board-section {
  flex: 0 0 auto;
}

main > .table-panel {
  flex: 1 1 auto;
}

.summary {
  display: grid;
  gap: 24px;
  padding: 24px;
}

.summary-top {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(360px, 1fr);
  gap: 24px;
}

.summary-charts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}

.metric strong {
  display: block;
  font-size: 32px;
  line-height: 1.05;
}

.metric span {
  color: var(--muted);
}

.summary-block h2 {
  margin: 0 0 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-family: var(--font-title);
}

.pie-wrap {
  display: block;
}

.pie {
  width: 72px;
  height: 72px;
  display: block;
  margin: 0 0 10px;
  shape-rendering: geometricPrecision;
}

.legend, .funders {
  display: grid;
  gap: 8px;
}

.legend-row, .funder-row {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}

.federation-others {
  display: grid;
  gap: 8px;
}

.federation-others-toggle {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 400;
  text-align: left;
}

.federation-others-toggle:hover { background: transparent; color: var(--ink); }
.federation-others-name { display: inline-flex; align-items: center; gap: 6px; }
.federation-others-name .icon { font-size: 14px; }
.federation-others-details {
  display: grid;
  gap: 8px;
  margin-left: 22px;
  padding-top: 2px;
  border-left: 1px solid var(--line);
}
.legend-row-nested { padding-left: 8px; }

.funder-row {
  grid-template-columns: minmax(0, 1fr) auto;
  border-bottom: 1px solid var(--ft--color-border-neutral-default-weaker);
  padding-bottom: 6px;
}

.swatch {
  width: 10px;
  height: 10px;
}

.count {
  font-weight: 700;
}

.table-panel {
  /* Le conteneur doit rester borne en hauteur. Sans cela il grandit avec le
     nombre de lignes et sa barre de defilement horizontale se retrouve sous la
     derniere ligne, donc hors ecran : impossible d'atteindre les colonnes de
     droite sans avoir deroule toute la liste au prealable. La hauteur vient de
     la place libre dans la page ; le plafond n'est qu'un garde-fou pour le cas
     ou la colonne des filtres depasserait l'ecran. */
  max-height: 100vh;
  min-height: 260px;
  overflow: auto;
  overscroll-behavior: contain;
}

table {
  width: 100%;
  min-width: 980px;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: var(--radius-surface);
  table-layout: fixed;
}

.col-agency { width: 15%; }
.col-club { width: 17%; }
.col-action { width: 27%; }
.col-status { width: 12%; }
.col-finance { width: 25%; }
.col-edit { width: 100px; }

th {
  height: var(--ft--table-th-height);
  padding: .25rem var(--ft--table-padding-x);
  background: var(--ft--color-background-primary-weakest);
  border-bottom: 1px solid var(--line);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-align: left;
  text-transform: uppercase;
  font-family: var(--font-title);
}

/* Les entetes restent visibles pendant le defilement vertical du tableau. */
.table-panel thead th {
  position: sticky;
  top: 0;
  z-index: 3;
}

/* Un th sticky cree un contexte d'empilement : sans ce rehaussement, le menu de
   tri d'une colonne passerait sous la colonne suivante. */
.table-panel thead th:has(details[open]) {
  z-index: 6;
}

th > select {
  display: inline-block;
  min-height: 0;
  width: 18px;
  min-width: 18px;
  height: 16px;
  margin: 0 0 0 4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 0;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
  vertical-align: middle;
}

th > select option {
  font-size: 12px;
}

td {
  padding: var(--ft--table-padding-y) var(--ft--table-padding-x);
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  line-height: 1.32;
}

/* Le tableau France Travail centre les cellules par défaut. Le dashboard doit
   démarrer chaque information au même niveau pour faciliter le balayage. */
.table-panel td {
  vertical-align: top;
}

tbody tr:hover { background: var(--ft--color-background-primary-weakest); }

/* La colonne « Modifier » est la plus a droite, donc la plus penible a atteindre
   des que le tableau deborde. On la fige contre le bord droit du conteneur. */
.table-panel thead th:last-child,
.table-panel tbody td:last-child {
  position: sticky;
  right: 0;
  border-left: 1px solid var(--line);
}

.table-panel thead th:last-child {
  z-index: 4;
}

.table-panel tbody td:last-child {
  z-index: 2;
  /* Fond opaque obligatoire : la cellule figee se superpose aux autres. */
  background: var(--panel);
}

.table-panel tbody tr:hover td:last-child {
  background: var(--ft--color-background-primary-weakest);
}

.strong { font-weight: 800; }
.muted { margin-top: 2px; color: var(--muted); }

.status-tag {
  display: inline-block;
  padding: 4px 8px;
  border-radius: var(--radius-control);
  background: var(--ft--color-background-neutral-default-weaker);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  border: 1px solid transparent;
}

/* Le design system ne colore jamais le texte pose sur un fond de couleur : sa
   regle .tag fixe l'encre par defaut, et ses variantes ne declarent qu'un fond.
   Seuls les fonds sombres passent le texte en blanc. On suit cette convention,
   qui donne de 11,89:1 a 12,97:1 la ou une encre coloree tombait sous 4,5:1. */
.status-tag.projet,
.status-tag.en_cours { background: var(--ft-color-background-info-weakest); }
.status-tag.planifie,
.status-tag.planifiee,
.status-tag.a-confirmer,
.status-tag.suspendu { background: var(--ft-color-background-warning-weakest); }
.status-tag.realise,
.status-tag.realisee { background: var(--ft-color-background-success-weakest); }
.status-tag.annule,
.status-tag.annulee { background: var(--ft-color-background-error-weakest); }

.bar {
  display: flex;
  width: 100%;
  margin: 8px 0 6px;
}

.bar .progress-bar { max-width: 100%; }

.money-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
}

th:last-child,
td:last-child { padding-right: var(--ft--table-padding-x); padding-left: var(--ft--table-padding-x); }
/* Le design system n'offre pas de bouton destructeur : on garde la couleur
   d'erreur par-dessus le bouton secondaire, et la largeur de la colonne. */
.finance-remove { width: 100%; border-color: var(--ft--icon-error); color: var(--ft--icon-error); }
.finance-remove:hover { background: var(--ft--icon-error); border-color: var(--ft--icon-error); color: var(--ft-color-background-neutral-light); }

/* La fiche est une page a part entiere : elle remplace la liste plutot que de
   flotter au-dessus. Elle prend donc la hauteur restante et defile elle-meme. */
.edit-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 24px;
}

.edit-view.is-hidden { display: none; }

.edit-panel {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-surface);
  overflow: hidden;
}

.edit-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 40px; background: var(--panel); border-bottom: 1px solid var(--line); }
.edit-header-title { display: grid; min-width: 0; }
.edit-header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; }
.edit-header h1 { margin: 0; }
/* Le design system n'a pas de bouton destructeur : on reprend le bouton primaire
   avec les jetons de couleur d'erreur du design system. */
.btn-supprimer { background-color: var(--ft-color-background-error-default); border-color: var(--ft-color-background-error-default); }
.btn-supprimer:hover, .btn-supprimer:focus-visible { background-color: var(--ft-color-background-error-strong); border-color: var(--ft-color-background-error-strong); }
.edit-layout { display: grid; gap: 24px; padding: 24px 40px 40px; }
.edit-row { display: grid; gap: 24px; align-items: stretch; }
.edit-row-top { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.edit-row-bottom { grid-template-columns: minmax(0, .55fr) minmax(0, 1.45fr); }
.edit-stack { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 24px; min-height: 100%; }
.edit-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-surface); }
.edit-card.finance-card { grid-column: auto; }
.edit-card .section-head { min-height: 40px; }
.edit-fields { display: grid; gap: 16px; padding: 24px; }
.edit-field { display: grid; gap: 6px; color: var(--muted); }
/* La carte « Action » porte huit champs : sur deux colonnes elle reste lisible
   sans allonger la modale. Intitule et Commentaire gardent la pleine largeur. */
.edit-fields-action { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; align-content: start; }
.edit-field-wide { grid-column: 1 / -1; }
.edit-field textarea { font: inherit; line-height: 1.5; resize: vertical; }
#editTitle { font-weight: 700; }
.public-picker { position: relative; }
.public-toggle { display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer; }
.public-options { display: none; position: absolute; z-index: 10; top: calc(100% + 2px); right: 0; left: 0; max-height: 210px; overflow: auto; padding: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 4px 12px var(--ft-color-background-opacity-dark-opacity); }
.public-picker.is-open .public-options { display: grid; gap: 6px; }
.readonly-value { min-height: var(--ft--form-control-height); color: var(--ink); font-size: 15px; }
.club-summary { display: grid; gap: 18px; color: var(--ink); font-size: 15px; line-height: 1.5; }
.club-summary strong { font-weight: 700; }
.agency-summary { display: grid; gap: 18px; color: var(--ink); font-size: 15px; line-height: 1.5; }
.agency-summary strong { font-weight: 700; }
/* Une ligne par statut, sur le modele du widget de reference : le controle de
   periode accompagne son statut au lieu d'occuper une cellule de grille. Les
   lignes non selectionnees n'ont donc que leur bouton et gardent toutes la
   meme hauteur, quelle que soit la hauteur du champ de periode affiche. */
.status-editor { display: grid; gap: 8px; }
.status-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.status-head-row .form-legend { margin-top: 0; }
.status-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
/* Le fond de selection vient de « with-checked-bg », qui le peint en teinte
   primaire sur le ::before du libelle. On garde sa mecanique et on ne remplace
   que la teinte, par le jeton semantique du statut : le reperage par couleur
   reste possible sans sortir de la palette du design system, et c'est la meme
   correspondance que celle de la pastille du tableau. */
/* Le design system dessine l'option choisie avec un calque qui epouse le contenu,
   du bord gauche du bloc a sa marge droite. Notre fond doit donc s'arreter la
   aussi : sans cela il remplit toute la cellule de la grille et deborde du cadre
   sur la droite. */
.status-option { white-space: nowrap; justify-self: start; }

/* Le fond va sur le conteneur, pas sur le ::before que peint le design system :
   celui-ci se superpose au texte, ce que sa teinte a 5 % rend sans consequence
   mais qu'une couleur franche masquerait. Le sien reste par-dessus, invisible. */
.status-options .form-check:has(.form-check-input:checked) { background-color: var(--statut-fond); border-radius: var(--ft--button-border-radius-sm); }
.status-options .form-check-input:checked + .form-check-label { font-weight: 700; }

.status-option.projet { --statut-fond: var(--ft-color-background-info-weakest); }
.status-option.planifie,
.status-option.planifiee,
.status-option.a-confirmer { --statut-fond: var(--ft-color-background-warning-weakest); }
.status-option.realise,
.status-option.realisee { --statut-fond: var(--ft-color-background-success-weakest); }
.status-option.annule,
.status-option.annulee { --statut-fond: var(--ft-color-background-error-weakest); }
.status-period-slot { display: grid; gap: 6px; margin-top: 8px; }
.status-period-label { color: var(--muted); font-size: 12px; }
.status-period-label:empty { display: none; }
.status-period { min-width: 0; max-width: 280px; }
.status-period input { min-width: 0; }
.status-period ft-datepicker { display: block; width: 100%; }
.finance-summary { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.finance-summary strong { color: var(--ink); }
.finance-progress { width: 100px; }
.finance-progress .progress-bar { max-width: 100%; }
.finance-open { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding: 16px 24px 0; }
.finance-open .finance-budget { width: 120px; }
.finance-editor { padding: 24px; }
.finance-budget { display: grid; grid-template-rows: 24px var(--ft--form-control-height); row-gap: 10px; align-self: start; }
.finance-budget label { display: flex; align-items: center; white-space: nowrap; }
.finance-budget input { min-width: 0; margin: 0; }
.finance-list { display: grid; grid-template-rows: auto auto auto; row-gap: 10px; }
.finance-list-head > span { padding: 0 8px; line-height: 1.2; overflow-wrap: break-word; }
.finance-list-head { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 0.95fr) 62px; gap: 12px; align-items: end; min-height: 24px; color: var(--muted); }
.finance-list #financeRows { display: grid; gap: 10px; padding: 0; }
.finance-empty { display: flex; align-items: center; min-height: var(--ft--form-control-height); color: var(--muted); font-size: 14px; font-style: italic; }
.finance-list .finance-add { justify-self: start; }
/* Le statut de versement ne contient plus qu'un texte court : sa colonne laissait
   un grand vide avant le bouton Retirer. C'est cet espace qui revient au montant,
   jusqu'ici la colonne la plus etroite de la ligne. Le selecteur de financeur,
   lui, garde sa largeur. */
.finance-row { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 0.95fr) 62px; gap: 12px; min-height: var(--ft--form-control-height); align-items: center; }
.finance-row .finance-status { display: flex; align-items: center; min-height: var(--ft--form-control-height); padding: 6px 8px; color: var(--ink); }
.finance-row .form-control { min-width: 0; }
/* Bloc « Convention » : de simples phrases dans le cadre de la fiche. */
.convention-fields p { margin: 0; color: var(--ink); }
.convention-fields .convention-aide { color: var(--muted); }
.edit-actions { display: flex; justify-content: flex-end; gap: 12px; padding: 0 40px 36px; }
/* L'alerte du design system apporte son fond, son retrait et sa couleur : il ne
   reste qu'a l'aligner sur les marges de la fiche. */
.edit-message { margin: 10px 40px 0; }

.empty {
  padding: 28px;
  color: var(--muted);
}

.is-hidden { display: none; }
.status-period.is-hidden { display: none; }

/* La colonne de filtres et le tableau (980 px minimum) ne tiennent plus cote a
   cote sous ~1340 px : 24 + 270 + 24 + 980 + 24 = 1322 px, plus la barre de
   defilement de l'iframe. On rend alors sa largeur au tableau et on repartit les
   filtres sur autant de colonnes que la place le permet, chacune assez large
   pour son titre. */
@media (max-width: 1340px) {
  .dashboard-layout { grid-template-columns: minmax(0, 1fr); }
  .filters-body { grid-template-columns: repeat(auto-fit, minmax(var(--filter-col), 1fr)); }
}

@media (max-width: 900px) {
  .dashboard-layout { padding: 14px; }
  .topbar { align-items: flex-start; flex-direction: column; }
  .summary-top,
  .summary-charts { grid-template-columns: 1fr; }
  h1 { font-size: 22px; }
  .edit-layout { padding: 14px; }
  .edit-row-top,
  .edit-row-bottom { grid-template-columns: 1fr; }
  .edit-fields-action { grid-template-columns: 1fr; }
  .edit-card.finance-card { grid-column: auto; }
  .finance-list-head { display: none; }
  .finance-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 62px; }
  .finance-row .finance-select { grid-column: 1 / -1; }
  .edit-header { align-items: flex-start; flex-direction: column; padding: 18px; }
  .edit-header-actions { width: 100%; justify-content: flex-end; }
  .edit-actions { padding-left: 14px; padding-right: 14px; }
  .edit-message { margin-left: 14px; margin-right: 14px; }
}

/* Sur un ecran de telephone, les 100px de la colonne « Modifier » figee
   accapareraient un tiers de la largeur et recouvriraient la colonne Club. Elle
   redevient donc une colonne ordinaire, qui defile avec le reste du tableau.
   Le gel reste actif au-dessus de ce seuil, ou il est un gain. */
@media (max-width: 700px) {
  .table-panel thead th:last-child,
  .table-panel tbody td:last-child {
    position: static;
  }
}

/* Fenetre « Ajout d'une action » : la structure (.modal, .modal-dialog,
   .modal-content, .modal-header, .modal-body, .modal-footer) et son habillage
   viennent du design system. Sa feuille masque .modal par defaut, en attendant
   le script du design system qui l'affiche : nous l'affichons nous-memes en
   ne la creant que pendant qu'elle est ouverte. */
#addActionModal .modal, #deleteActionModal .modal { display: block; overflow-y: auto; }
.add-action-fields { display: grid; gap: 16px; }

/* Fenetre « Convention » : meme affichage que les deux fenetres ci-dessus, dans
   une regle a part. Une colonne, puis deux colonnes cote a cote des 1100 px : Club
   (3 parts) plus large qu'Agence (2 parts), soit 60 % / 40 %, pour que l'encart du club
   tienne en largeur. Rien n'est reserve pour un troisieme bloc. Aucune couleur : tout
   vient du design system. */
#conventionModal .modal, #conventionPdfModal .modal { display: block; overflow-y: auto; }
/* Pop-up d'apercu du PDF (« Voir la convention ») : plein ecran DANS le widget (pas l'ecran de
   l'ordinateur), sans fond assombri. La feuille du design system n'a pas de classe plein ecran pour
   modal-dialog (verifie : seul modal-side existe, un panneau lateral) : cette classe du widget
   donne seulement la taille et retire les marges. Les max-height neutralisent ceux de
   modal-dialog-scrollable, qui laisseraient une bande de 3,5 rem en bas. Aucune couleur. */
#conventionPdfModal .convention-pdf-plein-ecran { max-width: none; width: 100%; height: 100%; max-height: none; margin: 0; }
#conventionPdfModal .convention-pdf-plein-ecran .modal-content { height: 100%; max-height: none; border-radius: 0; }
/* En-tete : le nom du fichier (titre) passe a la ligne s'il est long, et les commandes passent
   sous lui si la largeur manque (mobile). modal-header range deja titre a gauche, commandes a droite. */
#conventionPdfModal .modal-header { flex-wrap: wrap; gap: 12px; }
#conventionPdfModal .modal-title { min-width: 0; overflow-wrap: anywhere; }
/* Cadre du PDF : toute la largeur, sans bordure. Pas de variable du design system pour une hauteur
   d'apercu. 150 px = en-tete (une ligne, environ 70) + texte de repli (environ 45) + remplissage du
   corps (environ 35) : estimations de la note UX, a ajuster a l'oeil dans Grist DEV. 100vh est la
   hauteur du cadre du widget. La fenetre defile si le widget est plus bas. */
.convention-pdf-cadre { display: block; width: 100%; height: calc(100vh - 150px); min-height: 420px; border: 0; }
.convention-grid { display: grid; gap: 24px; }
@media (min-width: 1100px) {
  /* Cote a cote : 40 px entre les deux colonnes (meme valeur que les marges de la fiche d'action),
     pour une separation nette. En une colonne, l'espace reste de 24 px. */
  .convention-grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); column-gap: 40px; }
}
/* Sous-titre et phrase d'introduction : pas de marge propre ni d'espace en haut du corps,
   pour que la phrase suive le sous-titre de pres. */
.convention-soustitre, .convention-intro { margin: 0; }
#conventionModal .modal-body { padding-top: 0; }
.convention-intro { margin-bottom: 16px; }
.convention-part { min-width: 0; margin: 0; padding: 0; border: 0; }
.convention-champs { display: grid; gap: 16px; }
/* Encart du club (lecture seule) : pas de poignee de redimensionnement, pas de defilement ;
   sa hauteur est reglee par le script (conventionAjusterEncart) d'apres son contenu. Le
   selecteur est plus precis que « .edit-field textarea », qui autorise resize: vertical. */
.edit-field textarea.convention-encart { resize: none; overflow: hidden; }
/* Boutons du bloc Convention : ils gardent leur taille et passent a la ligne. */
.convention-actions { display: flex; flex-wrap: wrap; gap: 12px; }
/* Bloc « Convention » : le contenu (phrases et boutons) est refait seul apres une generation,
   dans un conteneur qui ne change pas la grille de .edit-fields. La zone de message
   (role="status") reste dans la page ; vide, elle ne prend pas de place. */
.convention-contenu { display: contents; }
.convention-alerte:empty { margin-bottom: -16px; }
/* Dépôt du fichier signé : la zone d'attente (role="status") reste dans la page, vide, sans
   prendre de place ; le champ fichier est caché (comme .logo-input du widget clubs). */
.convention-depot-attente:empty { margin-bottom: -16px; }
.convention-file { display: none; }
</style>

    <script>
grist.ready({requiredAccess: 'full'});

// Contacts, Conventions et Modeles_convention servent a la convention de
// partenariat (lecture seule pour l'instant). Une table que les regles d'acces
// refusent (ex. ANS : ni Conventions ni Modeles_convention) devient une liste
// vide dans load(), comme toutes les autres.
// Campagnes sert au sous-titre de la fenetre Convention (Actions.Campagne est une reference
// vers Campagnes.Campagne, le texte de l'annee).
const TABLES = ['Actions', 'Cofinancements', 'Agences', 'DD', 'DR', 'Structures', 'Dispositifs', 'Federations', 'Financements', 'Financeurs', 'Reponses_AAP', 'Contacts', 'Conventions', 'Modeles_convention', 'Campagnes'];
const COLORS = [
  '#283276',
  '#008ECF',
  '#F29FC5',
  '#FFE000',
  '#E1000F',
  '#8B4B8F',
  '#005B8F',
  '#D94F9D',
  '#7A6A00',
  '#8F0010',
  '#5F6BC4',
  '#00A6A6'
];
// Troisieme colonne : le libelle affiche tant qu'aucune valeur n'est choisie,
// accorde au genre de ce que le filtre designe.
const FILTERS = [
  ['osiris', 'Numéro Osiris', ''],
  ['dr', 'Direction régionale (DR)', 'Toutes'],
  ['dd', 'Direction départementale (DD)', 'Toutes'],
  ['agency', 'Agence', 'Toutes'],
  ['federation', 'Fédération', 'Toutes'],
  ['club', 'Club', 'Tous'],
  ['dispositif', 'Dispositif', 'Tous'],
  ['statut', 'Statut', 'Tous'],
  ['financeur', 'Financeur', 'Tous'],
  ['financement', 'Financement', 'Tous']
];
// Filtres a liste deroulante avec recherche, filtres a saisie libre, et les
// trois etats de financement, qui sont calcules et non lus dans une colonne.
const SEARCHABLE_FILTERS = new Set(['agency', 'club', 'federation', 'dd']);
const TEXT_FILTERS = new Set(['osiris']);
const FINANCEMENT_STATES = ['100% financé', 'Partiellement financé', 'Non financé'];

const state = { raw: {}, tablesRefusees: [], actions: [], filters: {}, statusChoices: [], publicChoices: [], formatChoices: [], summaryOpen: false, filtersOpen: false, federationOthersOpen: false, sort: {}, view: 'dashboard', editingId: null, addActionOpen: false, deleteOpen: false, conventionOpen: false, conventionPdfOpen: false };

document.getElementById('resetBtn').addEventListener('click', () => {
  state.filters = {};
  render();
});

document.getElementById('toggleSummary').addEventListener('click', () => {
  state.summaryOpen = !state.summaryOpen;
  render();
});

document.getElementById('toggleFilters').addEventListener('click', () => {
  state.filtersOpen = !state.filtersOpen;
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => exportCsv(filteredActions()));
document.getElementById('addActionBtn').addEventListener('click', openAddAction);

document.addEventListener('pointerdown', event => {
  if (event.target.closest('.filter-search-dropdown, .sort-menu')) return;
  document.querySelectorAll('.filter-search-dropdown[open], .sort-menu[open]').forEach(dropdown => dropdown.removeAttribute('open'));
});

document.querySelectorAll('[data-sort-option]').forEach(button => {
  button.addEventListener('click', event => {
    const key = event.currentTarget.dataset.sortOption;
    const direction = event.currentTarget.dataset.sortDirection;
    state.sort = direction ? {key, direction} : {};
    document.querySelectorAll('.sort-menu[open]').forEach(menu => menu.removeAttribute('open'));
    renderRows(filteredActions());
  });
});

load();

async function load() {
  try {
    // Noms des tables que Grist n'a pas laisse lire (refus ou table introuvable) :
    // sans cette trace, une table refusee et une table vide donnent la meme liste.
    const refusees = [];
    const data = await Promise.all(TABLES.map(async table => {
      try {
        return [table, rows(await grist.docApi.fetchTable(table))];
      } catch (error) {
        console.warn(`Accès refusé ou table introuvable : ${table}`, error);
        refusees.push(table);
        return [table, []];
      }
    }));
    state.raw = Object.fromEntries(data);
    state.tablesRefusees = refusees;
    state.statusChoices = await loadColumnChoices('Actions', 'Statut');
    state.publicChoices = await loadColumnChoices('Actions', 'Public');
    state.formatChoices = await loadColumnChoices('Actions', 'Format');
    state.actions = buildActions(state.raw);
    ouvrirActionDemandee();
    render();
  } catch (error) {
    document.getElementById('rows').innerHTML = '';
    document.getElementById('empty').classList.remove('is-hidden');
    document.getElementById('empty').textContent = "Impossible de lire les tables Grist. Vérifiez que le widget a l'accès complet.";
    console.error(error);
  }
}

// Passage de relais depuis le widget « fiche club ». Celui-ci depose dans le
// localStorage l'identifiant de l'action a ouvrir, puis fait naviguer la page
// vers le tableau de bord. Les deux widgets sont servis par la meme origine :
// ils partagent donc le meme stockage. La note est volontairement perissable,
// sans quoi un retour ulterieur sur le tableau de bord rouvrirait une fiche que
// plus personne n'a demandee.
const NOTE_OUVERTURE = 'clubs-ouvrir-action-v1';
const NOTE_VALIDITE_MS = 20000;

function lireNoteOuverture() {
  let brut = null;
  try {
    brut = window.localStorage.getItem(NOTE_OUVERTURE);
    // Lue une fois, jetee — y compris quand elle est illisible ou perimee, pour
    // qu'une note abimee ne reste pas coincee dans le stockage.
    window.localStorage.removeItem(NOTE_OUVERTURE);
  } catch (error) {
    // Navigation privee, stockage bloque, ou pas de localStorage du tout.
    return null;
  }
  if (!brut) return null;
  let note;
  try {
    note = JSON.parse(brut);
  } catch (error) {
    return null;
  }
  if (!note || typeof note !== 'object') return null;
  const id = Number(note.actionId);
  const ts = Number(note.ts);
  if (!Number.isFinite(id) || !Number.isFinite(ts)) return null;
  const age = Date.now() - ts;
  // Une note datee du futur ne peut venir que d'une horloge qui a bouge : on la
  // traite comme perimee plutot que de la laisser valable indefiniment.
  if (age < 0 || age > NOTE_VALIDITE_MS) return null;
  return id;
}

// Appelee juste avant le premier rendu : elle ne fait que preparer l'etat, le
// rendu qui suit se charge d'afficher la fiche.
function ouvrirActionDemandee() {
  const id = lireNoteOuverture();
  if (id === null) return;
  // Un identifiant inconnu ici n'a rien d'anormal : les regles d'acces peuvent
  // masquer a ce lecteur une action que le widget club lui montrait.
  if (!state.actions.some(action => action.id === id)) return;
  state.editingId = id;
  state.view = 'edit';
}

// Les listes de choix vivent dans la configuration des colonnes Grist. Trois
// chemins pour les lire, du plus fiable au dernier recours :
//   1. l'API REST /columns, qui ne demande que le droit de lecture de la table ;
//   2. les tables de métadonnées, refusées aux utilisateurs non propriétaires
//      dès qu'une règle d'accès retire la lecture par défaut (`-CRUD` sur `*`) ;
//   3. les listes ci-dessous, pour que personne ne se retrouve avec un menu vide.
const FALLBACK_CHOICES = {
  'Actions.Statut': ['A confirmer', 'Planifiée', 'Réalisée', 'Annulée'],
  'Actions.Public': ['BRSA', 'ZRR', 'QPV', 'Jeunes', 'Seniors', 'DELD', 'Infra Bac', 'DEBOE', 'Femmes', 'Hommes'],
  'Actions.Format': ['Demi-journée', 'Journée']
};

let accessTokenPromise = null;
const columnsCache = new Map();
let metaTablesPromise = null;

async function loadColumnChoices(tableId, colId) {
  const fromRest = await choicesFromRestApi(tableId, colId);
  if (fromRest.length) return fromRest;
  const fromMeta = await choicesFromMetaTables(tableId, colId);
  if (fromMeta.length) return fromMeta;
  console.warn(`Choix de ${tableId}.${colId} illisibles dans Grist : utilisation de la liste de secours.`);
  return FALLBACK_CHOICES[`${tableId}.${colId}`] || [];
}

async function choicesFromRestApi(tableId, colId) {
  const columns = await fetchTableColumns(tableId);
  const column = columns.find(item => item.id === colId);
  const options = parseWidgetOptions(column?.fields?.widgetOptions);
  return Array.isArray(options.choices) ? options.choices : [];
}

function fetchTableColumns(tableId) {
  if (!columnsCache.has(tableId)) {
    columnsCache.set(tableId, requestTableColumns(tableId).catch(() => {
      // Texte fixe : l'erreur d'un fetch peut contenir l'adresse, donc le jeton de lecture.
      console.warn(`Impossible de lire les colonnes de ${tableId} via l'API REST.`);
      return [];
    }));
  }
  return columnsCache.get(tableId);
}

async function requestTableColumns(tableId) {
  accessTokenPromise ||= grist.docApi.getAccessToken({readOnly: true});
  const {token, baseUrl} = await accessTokenPromise;
  const url = `${baseUrl}/tables/${encodeURIComponent(tableId)}/columns?auth=${encodeURIComponent(token)}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP ${response.status} sur ${tableId}/columns`);
  const payload = await response.json();
  return Array.isArray(payload.columns) ? payload.columns : [];
}

async function choicesFromMetaTables(tableId, colId) {
  try {
    metaTablesPromise ||= Promise.all([
      grist.docApi.fetchTable('_grist_Tables'),
      grist.docApi.fetchTable('_grist_Tables_column')
    ]);
    const [tables, columns] = await metaTablesPromise;
    const table = rows(tables).find(item => item.tableId === tableId);
    const column = rows(columns).find(item => item.parentId === table?.id && item.colId === colId);
    const options = parseWidgetOptions(column?.widgetOptions);
    return Array.isArray(options.choices) ? options.choices : [];
  } catch (error) {
    console.warn(`Impossible de lire les choix de ${tableId}.${colId} dans les métadonnées`, error);
    metaTablesPromise = null;
    return [];
  }
}

function parseWidgetOptions(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  try {
    return JSON.parse(value);
  } catch (error) {
    return {};
  }
}

function rows(table) {
  const ids = table.id || [];
  return ids.map((id, index) => {
    const row = {id};
    Object.keys(table).forEach(key => {
      if (key !== 'id') row[key] = table[key][index];
    });
    return row;
  });
}

// Une action supprimee reste dans Grist : sa colonne Corbeille (booleen) passe a
// vrai. Le texte « Oui » est aussi reconnu, au cas ou une colonne serait restee
// de type texte.
function enCorbeille(action) {
  const valeur = action.Corbeille;
  return valeur === true || String(valeur || '').trim().toLowerCase() === 'oui';
}

function byId(items) {
  return new Map(items.map(item => [item.id, item]));
}

function buildActions(raw) {
  const actions = byId(raw.Actions.filter(action => !enCorbeille(action)));
  const agencies = byId(raw.Agences);
  const dds = byId(raw.DD);
  const drs = byId(raw.DR);
  const clubs = byId(raw.Structures);
  const dispositifs = byId(raw.Dispositifs);
  const federations = byId(raw.Federations);
  const reponses = byId(raw.Reponses_AAP);
  const financements = byId(raw.Financements);
  const financeurs = byId(raw.Financeurs);
  const cofs = raw.Cofinancements.reduce((acc, cof) => {
    const actionId = cof.Action;
    if (!actionId || !actions.has(actionId)) return acc;
    const label = financeLabel(financements.get(cof.Financement) || {}, financeurs);
    (acc[actionId] ||= []).push({...cof, label: label || 'Financeur', montant: Number(cof.Montant || 0), statutVersement: cof.Statut_Versement || ''});
    return acc;
  }, {});

  return raw.Actions.filter(action => !enCorbeille(action)).map(action => {
    const agency = agencies.get(action.Agence) || {};
    const dd = dds.get(action.DD) || {};
    const dr = drs.get(action.DR) || {};
    const club = clubs.get(action.Club) || {};
    const dispositif = dispositifs.get(action.Dispositif) || {};
    const federation = federations.get(action.Federation) || {};
    const reponse = reponses.get(action.Reponse_AAP) || {};
    const lines = cofs[action.id] || [];
    const financed = lines.reduce((sum, item) => sum + item.montant, 0);
    return {
      id: action.id,
      intitule: action.Intitule || '',
      codeMee: action.Code_MEE || '',
      // Formule Grist : numero Osiris suivi de l'intitule, ou l'intitule seul.
      nomComplet: action.Nom_complet || action.Intitule || '',
      osiris: reponse.Numero_Action_Osiris || '',
      budget: Number(action.Budget || 0),
      ouvertAuFinancement: action.Ouvert_au_financement === true,
      financed,
      rate: action.Budget ? financed / Number(action.Budget) : 0,
      financement: financementState(financed, Number(action.Budget || 0)),
      participants: Number(action.Jauge || 0),
      format: action.Format || '',
      lieu: action.Lieu || '',
      commentaire: action.Commentaire || '',
      public: formatChoiceList(action.Public),
      publicChoices: choiceValues(action.Public),
      statut: action.Statut || '',
      date: action.Date || null,
      periodeApprox: action.Periode_approx || '',
      clubId: action.Club || 0,
      agencyId: action.Agence || 0,
      dispositifId: action.Dispositif || 0,
      federationId: action.Federation || 0,
      agency: agency.Libelle_agence || agency.Code_Aurore || '',
      dd: dd.Nom || '',
      dr: dr.Nom || '',
      club: club.Nom || '',
      ville: action.Ville || '',
      dispositif: dispositif.Dispositif || dispositif.Code || '',
      federation: federation.Nom || '',
      financeurs: lines
    };
  });
}

function financementState(financed, budget) {
  if (budget > 0) {
    const rate = financed / budget;
    if (rate >= 1) return FINANCEMENT_STATES[0];
    return rate > 0 ? FINANCEMENT_STATES[1] : FINANCEMENT_STATES[2];
  }
  return financed > 0 ? FINANCEMENT_STATES[0] : FINANCEMENT_STATES[2];
}

// Le design system place le libelle d'un bouton dans un span dedie.
function buttonLabel(id, text) {
  const button = document.getElementById(id);
  (button.querySelector('.btn-content') || button).textContent = text;
}

function renderResults() {
  const actions = filteredActions();
  renderSummary(actions);
  renderRows(actions);
  requestResize();
}

function render() {
  renderFilters();
  const actions = filteredActions();
  renderSummary(actions);
  renderRows(actions);
  const editing = state.view === 'edit';
  document.getElementById('editView').classList.toggle('is-hidden', !editing);
  document.getElementById('dashboardView').classList.toggle('is-hidden', editing);
  if (editing) renderEdit();
  requestResize();
}

function requestResize() {
  requestAnimationFrame(() => {
    if (window.grist && typeof grist.setHeight === 'function') {
      grist.setHeight(document.documentElement.scrollHeight);
    }
  });
}

function renderFilters() {
  const container = document.getElementById('filters');
  document.getElementById('filtersSection').classList.toggle('is-collapsed', !state.filtersOpen);
  document.getElementById('layout').classList.toggle('filters-collapsed', !state.filtersOpen);
  buttonLabel('toggleFilters', state.filtersOpen ? 'Replier' : 'Déplier');
  container.innerHTML = FILTERS.map(([key, label, tous]) => {
    const selected = state.filters[key] || '';
    if (TEXT_FILTERS.has(key)) {
      return `<div class="filter-field">
        <label class="form-label" for="filter-${key}">${escapeHtml(label)}</label>
        <span class="filter-text-control">
          <input class="form-control filter-text-input" type="search" id="filter-${key}" name="filter-${key}" data-filter-text="${key}" value="${escapeAttr(selected)}" placeholder="Rechercher">
          <button class="btn btn-primary filter-text-submit" type="button" data-filter-submit="${key}" aria-label="Lancer la recherche par ${escapeAttr(label)}" title="Chercher">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M10.4 10.4 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </button>
        </span>
      </div>`;
    }
    const values = optionsFor(key);
    if (SEARCHABLE_FILTERS.has(key)) {
      return `<div class="filter-field">
        <span class="form-label" id="filter-${key}-label">${escapeHtml(label)}</span>
        <details class="filter-search-dropdown">
          <summary class="form-control" aria-labelledby="filter-${key}-label"><span>${escapeHtml(selected || tous)}</span></summary>
          <div class="filter-search-panel">
            <input class="form-control filter-search-input" type="search" data-filter-search="${key}" placeholder="Rechercher" aria-label="Rechercher ${escapeAttr(label)}">
            <div class="filter-search-options">
              <button class="filter-search-option" type="button" data-filter-key="${key}" data-filter-value="">${escapeHtml(tous)}</button>
              ${values.map(value => `<button class="filter-search-option" type="button" data-filter-key="${key}" data-filter-value="${escapeAttr(value)}" title="${escapeAttr(value)}">${escapeHtml(value)}</button>`).join('')}
            </div>
          </div>
        </details>
      </div>`;
    }
    return `<div class="filter-field">
      <label class="form-label" for="filter-${key}">${escapeHtml(label)}</label>
      <select class="form-control" id="filter-${key}" name="filter-${key}" data-filter="${key}">
        <option value="">${escapeHtml(tous)}</option>
        ${values.map(value => `<option value="${escapeAttr(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(value)}</option>`).join('')}
      </select>
    </div>`;
  }).join('');

  container.querySelectorAll('select').forEach(select => {
    select.addEventListener('change', event => {
      const key = event.target.dataset.filter;
      state.filters[key] = event.target.value;
      if (!state.filters[key]) delete state.filters[key];
      pruneGeoFilters();
      render();
    });
  });

  // Le tableau ne se recalcule qu'a la demande : sur des milliers d'actions, un
  // filtrage a chaque frappe fige la page. On ne reconstruit pas non plus les
  // filtres, pour que le champ garde son texte, son focus et son curseur.
  const applyTextFilter = key => {
    const input = container.querySelector(`[data-filter-text="${key}"]`);
    const value = input ? input.value.trim() : '';
    if (value) state.filters[key] = value;
    else delete state.filters[key];
    renderResults();
  };

  container.querySelectorAll('[data-filter-text]').forEach(input => {
    // L'evenement « search » couvre la touche Entree et la croix d'effacement
    // que le navigateur ajoute lui-meme au champ.
    input.addEventListener('search', () => applyTextFilter(input.dataset.filterText));
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        applyTextFilter(input.dataset.filterText);
      }
    });
  });

  container.querySelectorAll('[data-filter-submit]').forEach(button => {
    button.addEventListener('click', () => applyTextFilter(button.dataset.filterSubmit));
  });

  container.querySelectorAll('[data-filter-search]').forEach(input => {
    input.addEventListener('input', event => {
      const query = normalizeText(event.target.value);
      const key = event.target.dataset.filterSearch;
      container.querySelectorAll(`[data-filter-key="${key}"]`).forEach(option => {
        option.hidden = query && !normalizeText(option.dataset.filterValue).includes(query);
      });
    });
  });

  container.querySelectorAll('[data-filter-key]').forEach(option => {
    option.addEventListener('click', event => {
      const key = event.currentTarget.dataset.filterKey;
      const value = event.currentTarget.dataset.filterValue;
      if (value) state.filters[key] = value;
      else delete state.filters[key];
      pruneGeoFilters();
      render();
    });
  });
}

// Retire de state.filters la DD et l'agence qui ne sont plus proposees apres un
// changement de DR ou de DD. La DD est verifiee avant l'agence, car l'agence
// depend de la DD.
function pruneGeoFilters() {
  ['dd', 'agency'].forEach(key => {
    if (state.filters[key] && !optionsFor(key).includes(state.filters[key])) delete state.filters[key];
  });
}

function optionsFor(key) {
  // Les trois etats de financement sont toujours proposes, dans cet ordre, meme
  // si aucune action de la selection courante ne s'y trouve.
  if (key === 'financement') return [...FINANCEMENT_STATES];
  const values = new Set();
  // DR, DD et agence sont dependantes : la DD ne propose que celles de la DR
  // choisie, l'agence que celles de la DD (ou, a defaut, de la DR) choisie.
  const parents = key === 'dd' ? ['dr'] : key === 'agency' ? ['dr', 'dd'] : [];
  const actions = state.actions.filter(action => parents.every(parent => !state.filters[parent] || action[parent] === state.filters[parent]));
  actions.forEach(action => {
    if (key === 'financeur') action.financeurs.forEach(item => item.label && values.add(item.label));
    else if (action[key]) values.add(action[key]);
  });
  return [...values].sort((a, b) => a.localeCompare(b, 'fr'));
}

function normalizeText(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase('fr');
}

function filteredActions() {
  const actions = state.actions.filter(action => Object.entries(state.filters).every(([key, value]) => {
    if (key === 'financeur') return action.financeurs.some(item => item.label === value);
    if (key === 'osiris') return normalizeText(action.osiris).includes(normalizeText(value));
    return action[key] === value;
  }));
  return sortActions(actions);
}

function bindStatusEditor() {
  const editor = document.getElementById('statusEditor');
  editor.querySelectorAll('[name="editStatus"]').forEach(radio => radio.addEventListener('change', () => {
    const previous = editor.querySelector('.status-period:not(.is-hidden) .edit-status-period');
    const previousKind = previous?.dataset.periodKind || '';
    const previousValue = previous ? readPeriodValue(previous) : '';
    const config = statusFieldConfig(radio.value);
    document.getElementById('statusPeriodLabel').textContent = outerPeriodLabel(radio.value);
    editor.querySelectorAll('.status-period').forEach(container => {
      const visible = container.dataset.statusDate === radio.value;
      container.classList.toggle('is-hidden', !visible);
      const input = container.querySelector('.edit-status-period');
      if (visible && input && previousKind === input.dataset.periodKind && previousValue) writePeriodValue(input, previousValue);
    });
  }));
}

// <ft-datepicker> (widget officiel France Travail) n'expose pas de propriété
// .value fiable : sa valeur choisie n'arrive que via l'évènement personnalisé
// "ft-datepicker-input-change", donc on la garde dans data-iso-value plutôt
// que de la relire depuis l'élément. readPeriodValue()/writePeriodValue()
// centralisent cette différence face au simple <input type="text"> (Projet).
function bindDatePickers() {
  document.querySelectorAll('.edit-status-period[data-period-kind="date"]').forEach(picker => {
    picker.addEventListener('ft-datepicker-input-change', event => {
      const raw = event.detail && event.detail.value;
      picker.dataset.isoValue = raw ? frDateToIso(raw) : '';
    });
  });
}

function readPeriodValue(input) {
  return input.dataset.periodKind === 'date' ? (input.dataset.isoValue || '') : (input.value || '');
}

function writePeriodValue(input, value) {
  if (input.dataset.periodKind === 'date') {
    input.dataset.isoValue = value;
    input.setAttribute('value', isoToFrDate(value));
  } else {
    input.value = value;
  }
}

function bindPublicPicker() {
  const picker = document.getElementById('publicPicker');
  const toggle = document.getElementById('publicToggle');
  toggle.addEventListener('click', event => {
    event.stopPropagation();
    picker.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(picker.classList.contains('is-open')));
  });
  picker.addEventListener('click', event => event.stopPropagation());
  picker.querySelectorAll('.public-choice').forEach(choice => choice.addEventListener('change', () => {
    const selected = [...picker.querySelectorAll('.public-choice:checked')].map(input => input.value);
    document.getElementById('publicToggleValue').textContent = selected.join(', ') || 'Choisir un public';
  }));
  document.addEventListener('click', () => {
    picker.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  });
}

function referenceOptions(items, selectedId, labelFor, placeholder) {
  const selectable = [...items]
    .map(item => [item.id, labelFor(item)])
    .filter(([, label]) => label)
    .sort((a, b) => a[1].localeCompare(b[1], 'fr'));
  const options = selectable.map(([id, label]) =>
    `<option value="${id}"${id === selectedId ? ' selected' : ''}>${escapeHtml(label)}</option>`);
  // Sans reference, le navigateur afficherait la premiere option de la liste :
  // l'action paraitrait rattachee a une agence qu'elle n'a pas, et le simple fait
  // d'enregistrer la fiche l'y rattacherait pour de bon.
  if (!selectable.some(([id]) => id === selectedId)) {
    options.unshift(`<option value="" selected disabled>${escapeHtml(placeholder)}</option>`);
  }
  return options.join('');
}

function financeOptions(selectedId) {
  const financeurs = byId(state.raw.Financeurs);
  return [...state.raw.Financements]
    .map(item => [item.id, financeLabel(item, financeurs)])
    .filter(([, label]) => label)
    .sort((a, b) => a[1].localeCompare(b[1], 'fr'))
    .map(([id, label]) => `<option value="${id}"${id === selectedId ? ' selected' : ''}>${escapeHtml(label)}</option>`)
    .join('');
}

// Le libelle d'un financement est son « Nom complet » (financeur et enveloppe),
// partout : fiche, liste, filtre, synthese, export. Sans cette colonne (document
// plus ancien) ou si elle est vide, on retombe sur l'ancien calcul.
function financeLabel(financement, financeurs) {
  const nomComplet = String(financement.Nom_complet || '').trim();
  if (nomComplet) return nomComplet;
  const financeur = financeurs.get(financement.Financeur) || {};
  return financeur.Nom === 'France Travail' ? financement.Enveloppe : financeur.Nom || '';
}

// La colonne Code_MEE est optionnelle : sans elle, le champ n'est pas propose et
// rien n'est ecrit (Grist refuserait toute la mise a jour).
function hasCodeMee() {
  return (state.raw.Actions || []).some(row => 'Code_MEE' in row);
}

function financeRow(item) {
  // Un financement deja verse ne se modifie plus et ne se retire plus.
  const verse = item.statutVersement === 'Versé';
  return `<div class="finance-row" data-cofinancement-id="${item.id || ''}">
    <select class="form-control finance-select"${verse ? ' disabled' : ''}><option value="">Choisir un financeur</option>${financeOptions(item.Financement)}</select>
    <input class="form-control finance-amount" type="number" min="0" placeholder="Montant" value="${item.montant == null ? '' : Math.round(item.montant)}"${verse ? ' readonly' : ''}>
    <div class="finance-status" data-statut="${escapeAttr(item.statutVersement || '')}">${escapeHtml(item.statutVersement)}</div>
    ${verse ? '<span aria-hidden="true"></span>' : '<button class="btn btn-secondary btn-sm finance-remove" type="button"><span class="btn-content">Retirer</span></button>'}
  </div>`;
}

function formatOptions(selected) {
  const options = withExistingValues(state.formatChoices, [selected])
    .map(choice => `<option value="${escapeAttr(choice)}"${choice === selected ? ' selected' : ''}>${escapeHtml(choice)}</option>`);
  // Le format n'est pas obligatoire : tant qu'il n'est pas saisi, aucun choix ne
  // doit apparaitre selectionne par defaut.
  options.unshift(`<option value=""${selected ? '' : ' selected'}>Choisir un format</option>`);
  return options.join('');
}

function financeEmptyState() {
  return '<div class="finance-empty">Aucun financeur ajouté.</div>';
}

function bindFinanceRows() {
  document.querySelectorAll('.finance-remove').forEach(button => {
    button.onclick = () => {
      const rows = button.closest('#financeRows');
      button.closest('.finance-row').remove();
      if (!rows.querySelector('.finance-row')) rows.innerHTML = financeEmptyState();
      updateFinanceSummary();
    };
  });
  document.querySelectorAll('.finance-amount').forEach(input => input.oninput = updateFinanceSummary);
}

function updateFinanceSummary() {
  const total = [...document.querySelectorAll('.finance-amount')].reduce((sum, input) => sum + Number(input.value || 0), 0);
  const budget = Number(document.getElementById('editBudget').value || 0);
  document.getElementById('editFinanced').textContent = formatEuro(total);
  document.getElementById('editRemaining').textContent = formatEuro(Math.max(0, budget - total));
  document.getElementById('editProgress').style.width = `${Math.min(100, budget ? Math.round(total / budget * 100) : 0)}%`;
}

// La fiche remplace la liste : le focus doit la suivre, puis revenir sur le
// bouton qui l'a ouverte. Pas de piegeage, ce n'est plus une boite de dialogue.
let vueOuvertePour = null;
let focusAvantFiche = null;

function focusFirstField(vue) {
  if (vueOuvertePour === state.editingId) return;
  focusAvantFiche = document.activeElement;
  vueOuvertePour = state.editingId;
  const premier = vue.querySelector('#editTitle');
  if (premier) premier.focus();
}

function closeEdit() {
  state.view = 'dashboard';
  state.editingId = null;
  vueOuvertePour = null;
  render();
  // Le tableau vient d'etre reconstruit : on rend le focus a un element vivant.
  if (focusAvantFiche && document.body.contains(focusAvantFiche)) focusAvantFiche.focus();
  else document.getElementById('exportBtn').focus();
  focusAvantFiche = null;
}

async function saveEdit(event, action) {
  event.preventDefault();
  const message = document.getElementById('editMessage');
  const messageTexte = message.querySelector('.alert-content');
  const submit = document.getElementById('saveEdit');
  const publicValues = [...document.querySelectorAll('.public-choice:checked')].map(input => input.value);
  const rows = [...document.querySelectorAll('.finance-row')].map(row => ({
    id: Number(row.dataset.cofinancementId || 0),
    financement: Number(row.querySelector('.finance-select').value || 0),
    montant: Number(row.querySelector('.finance-amount').value || 0),
    statutVersement: row.querySelector('.finance-status').dataset.statut || ''
  })).filter(row => row.financement && row.montant >= 0);
  const status = document.querySelector('[name="editStatus"]:checked')?.value || '';
  const statusConfig = statusFieldConfig(status);
  const periodInput = document.querySelector('.status-period:not(.is-hidden) .edit-status-period');
  const periodValue = periodInput ? readPeriodValue(periodInput).trim() : '';
  const actionUpdate = {
    Intitule: document.getElementById('editTitle').value.trim(),
    Dispositif: Number(document.getElementById('editDispositif').value || 0),
    Jauge: Number(document.getElementById('editParticipants').value || 0),
    Format: document.getElementById('editFormat').value,
    Ville: document.getElementById('editVille').value.trim(),
    Lieu: document.getElementById('editLieu').value.trim(),
    Commentaire: document.getElementById('editCommentaire').value.trim(),
    Public: ['L', ...publicValues],
    Agence: Number(document.getElementById('editAgency').value || 0),
    Statut: status,
    Date: statusConfig.kind === 'date' && periodValue ? Math.floor(new Date(`${periodValue}T00:00:00`).getTime() / 1000) : null,
    Periode_approx: statusConfig.kind === 'text' ? periodValue : '',
    Budget: Number(document.getElementById('editBudget').value || 0),
    Ouvert_au_financement: document.getElementById('editOpenToFunding').checked
  };
  if (hasCodeMee()) actionUpdate.Code_MEE = document.getElementById('editCodeMee').value.trim();
  const currentIds = new Set(action.financeurs.map(item => item.id));
  const usedIds = new Set(rows.filter(row => row.id).map(row => row.id));
  const userActions = [['UpdateRecord', 'Actions', action.id, actionUpdate]];
  rows.forEach(row => {
    const fields = {Financement: row.financement, Montant: row.montant, Action: action.id, Statut_Versement: row.statutVersement};
    if (row.id && currentIds.has(row.id)) userActions.push(['UpdateRecord', 'Cofinancements', row.id, fields]);
    else userActions.push(['AddRecord', 'Cofinancements', null, fields]);
  });
  action.financeurs.filter(item => !usedIds.has(item.id)).forEach(item => userActions.push(['RemoveRecord', 'Cofinancements', item.id]));
  try {
    submit.disabled = true;
    message.classList.add('is-hidden');
    await grist.docApi.applyUserActions(userActions);
    state.view = 'dashboard';
    state.editingId = null;
    vueOuvertePour = null;
    await load();
  } catch (error) {
    const detail = String(error?.message || error || '').trim();
    messageTexte.textContent = detail
      ? `L'enregistrement n'a pas abouti : ${detail}`
      : "L'enregistrement n'a pas abouti. Vérifiez l'accès complet du widget puis réessayez.";
    message.classList.remove('is-hidden');
    submit.disabled = false;
    console.error(error);
  }
}

// ---------------------------------------------------------------------------
// Suppression d'une action. La ligne n'est jamais retiree de Grist : on passe sa
// colonne Corbeille (booleen) a vrai, et tous les ecrans ignorent les actions en corbeille.
// Deux fenetres possibles : un refus (l'action porte des financements, il faut
// d'abord les retirer) ou une confirmation.
// ---------------------------------------------------------------------------

let focusAvantSuppression = null;

function deleteDialogHtml(action) {
  const bloquee = action.financeurs.length > 0;
  const titre = bloquee ? 'Suppression impossible' : "Suppression d'une action";
  const texte = bloquee
    ? 'Vous ne pouvez pas supprimer une action qui comporte des financements. Merci d\'abord de supprimer les financements de cette action ?'
    : `Êtes-vous sûr de vouloir supprimer l'action <strong>${escapeHtml(action.nomComplet || action.intitule)}</strong> ?`;
  const boutons = bloquee
    ? '<button type="button" class="btn btn-primary" id="deleteOk"><span class="btn-content">OK</span></button>'
    : '<button type="button" class="btn btn-secondary" id="cancelDelete"><span class="btn-content">Annuler</span></button><button type="button" class="btn btn-primary btn-supprimer" id="confirmDelete"><span class="btn-content">Valider</span></button>';
  return `<div class="modal-backdrop fade show"></div>
  <div class="modal fade show" id="deleteActionDialog" role="alertdialog" aria-modal="true" aria-labelledby="deleteActionTitle" aria-describedby="deleteActionText" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title" id="deleteActionTitle">${titre}</h2></div>
        <div class="modal-body">
          <div class="alert alert-error is-hidden" id="deleteActionMessage" role="alert" aria-live="assertive"><p class="alert-content"></p></div>
          <p id="deleteActionText">${texte}</p>
        </div>
        <div class="modal-footer">${boutons}</div>
      </div>
    </div>
  </div>`;
}

function openDeleteAction(action) {
  const host = document.getElementById('deleteActionModal');
  focusAvantSuppression = document.activeElement;
  state.deleteOpen = true;
  host.innerHTML = deleteDialogHtml(action);
  document.body.classList.add('modal-open');
  const ok = document.getElementById('deleteOk');
  if (ok) ok.addEventListener('click', closeDeleteAction);
  else {
    document.getElementById('cancelDelete').addEventListener('click', closeDeleteAction);
    document.getElementById('confirmDelete').addEventListener('click', () => confirmDeleteAction(action));
  }
  host.addEventListener('keydown', keepFocusInDelete);
  (ok || document.getElementById('cancelDelete')).focus();
  requestResize();
}

function closeDeleteAction() {
  const host = document.getElementById('deleteActionModal');
  host.removeEventListener('keydown', keepFocusInDelete);
  host.innerHTML = '';
  document.body.classList.remove('modal-open');
  state.deleteOpen = false;
  if (focusAvantSuppression && document.body.contains(focusAvantSuppression)) focusAvantSuppression.focus();
  focusAvantSuppression = null;
  requestResize();
}

function keepFocusInDelete(event) {
  if (event.key === 'Escape') {
    event.preventDefault();
    closeDeleteAction();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = [...document.querySelectorAll('#deleteActionDialog button:not(:disabled)')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

async function confirmDeleteAction(action) {
  const confirmer = document.getElementById('confirmDelete');
  const message = document.getElementById('deleteActionMessage');
  try {
    confirmer.disabled = true;
    message.classList.add('is-hidden');
    await grist.docApi.applyUserActions([['UpdateRecord', 'Actions', action.id, {Corbeille: true}]]);
    closeDeleteAction();
    state.view = 'dashboard';
    state.editingId = null;
    vueOuvertePour = null;
    focusAvantFiche = null;
    await load();
    document.getElementById('exportBtn').focus();
  } catch (error) {
    const detail = String(error?.message || error || '').trim();
    message.querySelector('.alert-content').textContent = detail
      ? `La suppression n'a pas abouti : ${detail}`
      : "La suppression n'a pas abouti. Vérifiez l'accès complet du widget puis réessayez.";
    message.classList.remove('is-hidden');
    confirmer.disabled = false;
    console.error(error);
  }
}

// ---------------------------------------------------------------------------
// Ajout d'une action : trois champs obligatoires (nom, dispositif, club) dans une
// fenetre du design system. Tout le reste se saisit ensuite dans la fiche de
// l'action, que l'on ouvre des la creation. Une fenetre convient ici, contrairement
// a la fiche complete : c'est un formulaire court, qui ne demande qu'une decision.

const ADD_ACTION_FIELDS = [
  {key: 'nom', id: 'addActionName', message: "Saisissez le nom de l'action."},
  {key: 'dispositif', id: 'addActionDispositif', message: 'Choisissez un dispositif.'},

];

let focusAvantAjout = null;

function addActionField(field, label, control) {

}

function addActionModalHtml() {
  const [nom, dispositif, club] = ADD_ACTION_FIELDS;
  const dispositifs = referenceOptions(state.raw.Dispositifs || [], 0, item => item.Dispositif || item.Code || '', 'Choisir un dispositif');
  const clubs = referenceOptions(state.raw.Structures || [], 0, item => item.Nom || '', 'Choisir un club');
  return `<div class="modal-backdrop fade show"></div>
  <div class="modal fade show" id="addActionDialog" role="dialog" aria-modal="true" aria-labelledby="addActionTitle" tabindex="-1">

      <form class="modal-content" id="addActionForm" novalidate>

            ${addActionField(dispositif, 'Dispositif', `<select class="form-control" id="${dispositif.id}" name="${dispositif.id}" required aria-describedby="${dispositif.id}Error">${dispositifs}</select>`)}
            ${addActionField(club, 'Club', `<select class="form-control" id="${club.id}" name="${club.id}" required aria-describedby="${club.id}Error">${clubs}</select>`)}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelAddAction"><span class="btn-content">Annuler</span></button>
          <button type="submit" class="btn btn-primary" id="submitAddAction"><span class="btn-content">Valider</span></button>
        </div>
      </form>
    </div>
  </div>`;
}

// Les valeurs saisies, sans toucher au DOM : c'est ce que les tests fournissent.
function readAddActionForm() {
  return {
    nom: document.getElementById('addActionName').value,
    dispositif: document.getElementById('addActionDispositif').value,
    club: document.getElementById('addActionClub').value
  };
}

// Les champs a refaire, dans l'ordre de la fenetre. Un nom fait d'espaces ne
// compte pas : Grist l'accepterait, et l'action apparaitrait sans intitule.
function addActionProblems(values) {
  return ADD_ACTION_FIELDS.filter(field => {
    const value = String(values[field.key] || '').trim();
    return field.key === 'nom' ? !value : !Number(value);
  });
}

function newActionFields(values) {
  return {
    Intitule: String(values.nom).trim(),
    Dispositif: Number(values.dispositif),
    Club: Number(values.club),
    Statut: 'A confirmer'
  };
}

function markAddActionProblems(problems) {
  ADD_ACTION_FIELDS.forEach(field => {
    const control = document.getElementById(field.id);
    const invalid = problems.includes(field);
    control.classList.toggle('is-invalid', invalid);
    if (invalid) control.setAttribute('aria-invalid', 'true');
    else control.removeAttribute('aria-invalid');
  });
}

function showAddActionMessage(text) {
  const message = document.getElementById('addActionMessage');
  message.querySelector('.alert-content').textContent = text;
  message.classList.remove('is-hidden');
}

function openAddAction() {
  const host = document.getElementById('addActionModal');
  focusAvantAjout = document.activeElement;
  state.addActionOpen = true;
  host.innerHTML = addActionModalHtml();
  document.body.classList.add('modal-open');
  document.getElementById('addActionForm').addEventListener('submit', submitAddAction);
  document.getElementById('cancelAddAction').addEventListener('click', closeAddAction);
  host.addEventListener('keydown', keepFocusInAddAction);
  document.getElementById('addActionName').focus();
  requestResize();
}

function closeAddAction() {
  const host = document.getElementById('addActionModal');
  host.removeEventListener('keydown', keepFocusInAddAction);
  host.innerHTML = '';
  document.body.classList.remove('modal-open');
  state.addActionOpen = false;
  // Le bouton qui a ouvert la fenetre reprend le focus, comme pour la fiche.
  if (focusAvantAjout && document.body.contains(focusAvantAjout)) focusAvantAjout.focus();
  focusAvantAjout = null;
  requestResize();
}

// Une boite de dialogue garde le focus : Tab et Maj+Tab tournent entre ses
// controles, Echap la ferme. Trois champs seulement sont en jeu, contrairement a la
// fiche complete : fermer sans confirmer ne perd presque rien.
function keepFocusInAddAction(event) {
  if (event.key === 'Escape') {
    event.preventDefault();
    closeAddAction();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = [...document.querySelectorAll('#addActionDialog input, #addActionDialog select, #addActionDialog button:not(:disabled)')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

async function submitAddAction(event) {
  event.preventDefault();
  const values = readAddActionForm();
  const problems = addActionProblems(values);
  markAddActionProblems(problems);
  if (problems.length) {
    document.getElementById(problems[0].id).focus();
    return;
  }
  const submit = document.getElementById('submitAddAction');
  const message = document.getElementById('addActionMessage');
  try {
    submit.disabled = true;
    message.classList.add('is-hidden');
    const result = await grist.docApi.applyUserActions([['AddRecord', 'Actions', null, newActionFields(values)]]);
    const newId = Number(result && result.retValues && result.retValues[0]);
    closeAddAction();
    await load();
    // Le reste de l'action se saisit dans sa fiche : on l'ouvre. Si elle n'est pas
    // visible pour cet utilisateur (regles d'acces), le tableau de bord reste affiche.
    if (newId && state.actions.some(action => action.id === newId)) {
      state.editingId = newId;
      state.view = 'edit';
      render();
    }
  } catch (error) {
    const detail = String(error?.message || error || '').trim();
    showAddActionMessage(detail
      ? `L'ajout n'a pas abouti : ${detail}`
      : "L'ajout n'a pas abouti. Vérifiez l'accès complet du widget puis réessayez.");
    submit.disabled = false;
    console.error(error);
  }
}

function pieBlock(title, entries) {
  const total = entries.reduce((sum, [, count]) => sum + count, 0) || 1;
  return `<div class="summary-block">
    <h2>${escapeHtml(title)}</h2>
    <div class="pie-wrap">
      ${pieSvg(entries, total)}
      <div class="legend">${entries.map(([name, count], index) => `
        <div class="legend-row">
          <span class="swatch" style="background:${colorForIndex(index)}"></span>
          <span>${escapeHtml(name || 'Non renseigné')}</span>
          <span class="count">${count} (${Math.round(count / total * 100)}%)</span>
        </div>
      `).join('')}</div>
    </div>
  </div>`;
}

function federationPieBlock(actions) {
  const allEntries = federationClubCounts(actions);
  const total = allEntries.reduce((sum, [, count]) => sum + count, 0) || 1;
  const topEntries = allEntries.slice(0, 10);
  const otherEntries = allEntries.slice(10);
  const chartEntries = otherEntries.length
    ? [...topEntries, ['Autres fédérations', otherEntries.reduce((sum, [, count]) => sum + count, 0)]]
    : topEntries;
  const otherCount = otherEntries.reduce((sum, [, count]) => sum + count, 0);
  const otherIndex = chartEntries.length - 1;

  return `<div class="summary-block">
    <h2>Répartition par fédération</h2>
    <div class="pie-wrap">
      ${pieSvg(chartEntries, total)}
      <div class="legend">
        ${topEntries.map(([name, count], index) => legendRow(name, count, total, colorForIndex(index))).join('')}
        ${otherEntries.length ? `
          <div class="federation-others">
            <button class="federation-others-toggle" id="toggleFederationOthers" type="button" aria-expanded="${state.federationOthersOpen}">
              <span class="swatch" style="background:${colorForIndex(otherIndex)}"></span>
