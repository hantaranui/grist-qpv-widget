<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actions d'insertion par le sport</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link href="https://cdn.francetravail.fr/studio/design-system/css/styles.css" rel="stylesheet">
    <script src="https://cdn.francetravail.fr/webco/v1/ft-autoloader.js" fetchpriority="high"></script>
    <style>
:root {
  color-scheme: light;
  /* Variables officielles du Design System France Travail. */
  --font-title: Marianne, Helvetica, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Marianne, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
  --radius-control: var(--ft--button-border-radius-sm);
  --radius-surface: var(--ft--button-border-radius);
  /* Hauteur utile laissee au tableau : tout ce qui le precede dans la page
     (topbar, marges du layout, entete de la synthese repliee). */
  /* Largeur plancher d'une colonne de filtre. Le plus long libelle,
     « Direction departementale (DD) », mesure 212 px en 14px/700 : en dessous
     de ce plancher le titre se couperait en deux lignes. On garde une marge
     pour les variantes de police (Segoe UI sous Windows). */
  --filter-col: 230px;
  --brand-navy: var(--ft--color-primary);
  --brand-blue: var(--ft--icon-info);
  --brand-pink: var(--ft--bg-info);
  --brand-yellow: var(--ft--bg-warning);
  --brand-red: var(--ft--icon-error);
  --bg: var(--ft--color-background-neutral-default-weakest);
  --panel: var(--ft-color-background-layout-body);
  --panel-soft: var(--ft--color-background-primary-weakest);
  --ink: var(--ft--color-text-color);
  --muted: var(--ft--color-background-neutral-default-strong);
  --line: var(--ft--color-border-neutral-default-weaker);
  --focus: var(--ft--icon-info);
  --accent: var(--ft--color-primary);
  --blue: var(--ft--bg-info);
  --pink: var(--ft--bg-info);
  --yellow: var(--ft--bg-warning);
  --red: var(--ft--bg-error);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
}

button, select, input {
  font: inherit;
}

button:not(.btn) {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.5;
}

button:disabled {
  font-style: italic;
}

button:not(.btn), select, input { border-radius: var(--radius-control); }

button:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid var(--ft--color-primary-20);
  outline-offset: 2px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

h1 {
  margin: 0;
  padding-left: 16px;
  border-left: 4px solid var(--brand-blue);
  font-size: 28px;
  line-height: 1.15;
  font-family: var(--font-title);
}

/* La page occupe la hauteur de l'ecran et la distribue : le tableau recupere
   tout ce que l'en-tete et les bandeaux ne prennent pas, quelle que soit la
   taille de l'ecran. La fiche de detail est en position fixed, hors de ce flux. */
#dashboardView {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.dashboard-layout {
  display: grid;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: none;
  margin: 0;
  /* 270px - 32px de padding = 238px utiles, soit le plus long libelle de filtre
     (212px) sans rupture de ligne. */
  grid-template-columns: 270px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  align-items: start;
  gap: 24px;
  padding: 24px;
}

/* La colonne des filtres garde la hauteur de son contenu, le contenu principal
   prend toute celle de la ligne. */
.dashboard-layout > main {
  align-self: stretch;
  min-height: 0;
}

/* Filtres replies : la colonne de gauche n'a plus de contenu a montrer, elle
   laisserait une bande vide sur un grand ecran. Le bandeau passe donc au-dessus,
   pleine largeur, et le tableau occupe tout l'espace. Deplier rend la colonne. */
.dashboard-layout.filters-collapsed {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
}

.filters, .board-section, .table-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-surface);
}

.board-section {
  overflow: hidden;
}

.board-section.is-collapsed {
  align-self: stretch;
  width: 100%;
  max-height: 40px;
  min-height: 0;
}

.board-section.is-collapsed .summary {
  display: none;
  height: 0;
  min-height: 0;
  overflow: hidden;
  padding: 0;
}

.board-section.is-collapsed .section-head {
  border-bottom: 0;
}

/* La zone des filtres se replie comme la synthese, mais garde ses controles dans
   le DOM : les valeurs choisies survivent au repliement. */
.filters.is-collapsed .filters-body {
  display: none;
}

.filters.is-collapsed > .section-head {
  border-bottom: 0;
}

/* Le titre et le bouton Reinitialiser vont ensemble a gauche, le bouton de
   repliement reste seul a droite. */
.section-head-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.filters > .section-head,
.board-section > .section-head,
.edit-card > .section-head {
  border-top-left-radius: calc(var(--radius-surface) - 1px);
  border-top-right-radius: calc(var(--radius-surface) - 1px);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 40px;
  padding: 0 16px;
  background: var(--ft--color-background-primary-weakest);
  border-bottom: 1px solid var(--line);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  font-family: var(--font-title);
}

.filters-body {
  display: grid;
  gap: 16px;
  padding: 18px 16px 20px;
}

/* Le titre d'un filtre ne se coupe jamais en milieu de libelle : si la place
   manque, c'est le bloc entier qui passe a la ligne suivante de la grille.
   Le nowrap est neutralise sur les enfants pour ne pas figer le select ni le
   menu de recherche. */
.filters-body > .filter-field {
  display: grid;
  gap: 8px;
  white-space: nowrap;
}

.filters-body > .filter-field > * {
  white-space: normal;
}

.filter-search-dropdown {
  position: relative;
  width: 100%;
}

/* Le resume porte form-control : il ne reste que ce que le design system ne dit
   pas d'un <summary>, sa disposition interne et le masquage du triangle natif. */
.filter-search-dropdown summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  list-style: none;
}

.filter-search-dropdown summary::-webkit-details-marker { display: none; }
.filter-search-dropdown summary .icon { margin-left: 12px; font-size: 16px; }
.filter-search-dropdown[open] summary .icon { transform: rotate(180deg); }

.sort-menu { position: relative; }
.sort-menu summary { display: inline-flex; align-items: center; gap: 8px; min-height: var(--ft--table-th-height); cursor: pointer; list-style: none; }
.sort-menu summary::-webkit-details-marker { display: none; }
.sort-menu summary .icon { font-size: 14px; }
.sort-options { position: absolute; z-index: 20; top: calc(100% - 4px); left: 0; display: grid; min-width: 130px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--panel); box-shadow: 0 4px 12px var(--ft-color-background-opacity-dark-opacity); }
.sort-options button { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 400; text-align: left; }
.sort-options button:hover { background: var(--ft--color-background-neutral-default-weakest); }
.sort-options .icon { font-size: 14px; }

.filter-search-panel {
  position: absolute;
  z-index: 20;
  top: calc(100% + 4px);
  left: 0;
  width: 420px;
  max-width: calc(100vw - 48px);
  display: grid;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: var(--panel);
  box-shadow: 0 4px 12px var(--ft-color-background-opacity-dark-opacity);
}

.filter-text-control {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.filter-text-submit {
  flex: 0 0 auto;
  width: var(--ft--form-control-height);
  min-height: var(--ft--form-control-height);
  padding: 0;
}

/* Le champ partage sa ligne avec le bouton loupe : il prend la place restante. */
.filter-text-input { min-width: 0; }

.filter-search-options {
  display: grid;
  gap: 2px;
  max-height: 220px;
  overflow-y: auto;
}

.filter-search-option {
  display: block;
  width: 100%;
  height: auto;
  min-height: 32px;
  padding: 6px 8px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.35;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-search-option:hover,
.filter-search-option:focus-visible {
  background: var(--ft--color-background-primary-weakest);
}

.filters select,
.filters select option {
  font-family: var(--font-body);
  font-weight: 400 !important;
}

main {
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}

main > .board-section {
  flex: 0 0 auto;
}

main > .table-panel {
  flex: 1 1 auto;
}

.summary {
  display: grid;
  gap: 24px;
  padding: 24px;
}

.summary-top {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(360px, 1fr);
  gap: 24px;
}

.summary-charts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}

.metric strong {
  display: block;
  font-size: 32px;
  line-height: 1.05;
}

.metric span {
  color: var(--muted);
}

.summary-block h2 {
  margin: 0 0 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-family: var(--font-title);
}

.pie-wrap {
  display: block;
}

.pie {
  width: 72px;
  height: 72px;
  display: block;
  margin: 0 0 10px;
  shape-rendering: geometricPrecision;
}

.legend, .funders {
  display: grid;
  gap: 8px;
}

.legend-row, .funder-row {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}

.federation-others {
  display: grid;
  gap: 8px;
}

.federation-others-toggle {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  font-weight: 400;
  text-align: left;
}

.federation-others-toggle:hover { background: transparent; color: var(--ink); }
.federation-others-name { display: inline-flex; align-items: center; gap: 6px; }
.federation-others-name .icon { font-size: 14px; }
.federation-others-details {
  display: grid;
  gap: 8px;
  margin-left: 22px;
  padding-top: 2px;
  border-left: 1px solid var(--line);
}
.legend-row-nested { padding-left: 8px; }

.funder-row {
  grid-template-columns: minmax(0, 1fr) auto;
  border-bottom: 1px solid var(--ft--color-border-neutral-default-weaker);
  padding-bottom: 6px;
}

.swatch {
  width: 10px;
  height: 10px;
}

.count {
  font-weight: 700;
}

/* Le conteneur de defilement est le notre et non « table-responsive » du design
   system : celui-ci impose height:100%, qui casse la chaine de hauteur dont
   depend le defilement interne, et surtout « tr:first-of-type > * {width:140px} »,
   qui ecraserait notre colgroup puisque table-layout:fixed fait de la premiere
   ligne la reference des largeurs. Il vise une autre forme de tableau que la
   notre. Son role, lui, est bien rempli ici. */
.table-panel {
  /* Le conteneur doit rester borne en hauteur. Sans cela il grandit avec le
     nombre de lignes et sa barre de defilement horizontale se retrouve sous la
     derniere ligne, donc hors ecran : impossible d'atteindre les colonnes de
     droite sans avoir deroule toute la liste au prealable. La hauteur vient de
     la place libre dans la page ; le plafond n'est qu'un garde-fou pour le cas
     ou la colonne des filtres depasserait l'ecran. */
  max-height: 100vh;
  min-height: 260px;
  overflow: auto;
  overscroll-behavior: contain;
}

table {
  min-width: 980px;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: var(--radius-surface);
  table-layout: fixed;
  margin-bottom: 0;
}

.col-agency { width: 15%; }
.col-club { width: 17%; }
.col-action { width: 27%; }
.col-status { width: 12%; }
.col-finance { width: 25%; }
.col-edit { width: 100px; }

thead th {
  background: var(--ft--color-background-primary-weakest);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-align: left;
  text-transform: uppercase;
  font-family: var(--font-title);
}

/* La cellule qui nomme l'action est un en-tete de ligne : elle se lit comme une
   cellule ordinaire, l'habillage ci-dessus ne valant que pour l'en-tete. */
tbody th {
  font-weight: inherit;
  text-align: left;
}

/* Le design system pose un filet haut sur chaque cellule et un filet bas sous
   l'en-tete. Nos en-tetes etant colles, le tableau garde border-collapse:
   separate, ou les deux filets ne fusionnent pas : on retire donc celui de la
   premiere ligne, qui doublerait celui de l'en-tete. */
.table tbody tr:first-child > * {
  border-top: 0;
}

/* Les entetes restent visibles pendant le defilement vertical du tableau. */
.table-panel thead th {
  position: sticky;
  top: 0;
  z-index: 3;
}

/* Un th sticky cree un contexte d'empilement : sans ce rehaussement, le menu de
   tri d'une colonne passerait sous la colonne suivante. */
.table-panel thead th:has(details[open]) {
  z-index: 6;
}

th > select {
  display: inline-block;
  min-height: 0;
  width: 18px;
  min-width: 18px;
  height: 16px;
  margin: 0 0 0 4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 0;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
  vertical-align: middle;
}

th > select option {
  font-size: 12px;
}

td, tbody th {
  line-height: 1.32;
}

/* Le tableau France Travail centre les cellules par défaut. Le dashboard doit
   démarrer chaque information au même niveau pour faciliter le balayage. */
.table-panel td,
.table-panel tbody th {
  vertical-align: top;
}

tbody tr:hover { background: var(--ft--color-background-primary-weakest); }

/* La colonne « Modifier » est la plus a droite, donc la plus penible a atteindre
   des que le tableau deborde. On la fige contre le bord droit du conteneur. */
.table-panel thead th:last-child,
.table-panel tbody td:last-child {
  position: sticky;
  right: 0;
  border-left: 1px solid var(--line);
}

.table-panel thead th:last-child {
  z-index: 4;
}

.table-panel tbody td:last-child {
  z-index: 2;
  /* Fond opaque obligatoire : la cellule figee se superpose aux autres. */
  background: var(--panel);
}

.table-panel tbody tr:hover td:last-child {
  background: var(--ft--color-background-primary-weakest);
}

.strong { font-weight: 800; }
.muted { margin-top: 2px; color: var(--muted); }

.status-tag {
  display: inline-block;
  padding: 4px 8px;
  border-radius: var(--radius-control);
  background: var(--ft--color-background-neutral-default-weaker);
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  border: 1px solid transparent;
}

.status-tag.projet { background: var(--ft--bg-info); border-color: var(--ft--border-info); color: var(--ft--icon-info); }
.status-tag.planifie,
.status-tag.planifiee { background: var(--ft--bg-warning); border-color: var(--ft--border-warning); color: var(--ft--icon-warning); }
.status-tag.realise,
.status-tag.realisee { background: var(--ft--bg-success); border-color: var(--ft--border-success); color: var(--ft--icon-success); }
.status-tag.annule,
.status-tag.annulee { background: var(--ft--bg-error); border-color: var(--ft--border-error); color: var(--ft--icon-error); }
.status-tag.a-confirmer { background: var(--ft--bg-warning); border-color: var(--ft--border-warning); color: var(--ft--icon-warning); }
.status-tag.en_cours { background: var(--ft--bg-info); color: var(--ft--icon-info); }
.status-tag.suspendu { background: var(--ft--bg-warning); color: var(--ft--icon-warning); }

.bar {
  display: flex;
  width: 100%;
  margin: 8px 0 6px;
}

.bar .progress-bar { max-width: 100%; }

.money-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
}

th:last-child,
td:last-child { padding-right: var(--ft--table-padding-x); padding-left: var(--ft--table-padding-x); }
/* Le design system n'offre pas de bouton destructeur : on garde la couleur
   d'erreur par-dessus le bouton secondaire, et la largeur de la colonne. */
.finance-remove { width: 100%; border-color: var(--ft--icon-error); color: var(--ft--icon-error); }
.finance-remove:hover { background: var(--ft--icon-error); border-color: var(--ft--icon-error); color: var(--ft-color-background-neutral-light); }

.edit-view {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow: auto;
  padding: 32px 16px;
  background: rgba(15, 20, 56, .45);
}
.edit-view.is-hidden { display: none; }
.edit-panel {
  width: 100%;
  max-width: 1120px;
  background: var(--panel);
  border-radius: var(--radius-surface);
  box-shadow: 0 16px 40px rgba(15, 20, 56, .3);
  overflow: hidden;
}
.edit-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 40px; background: var(--panel); border-bottom: 1px solid var(--line); }
.edit-header-title { display: grid; min-width: 0; }
.edit-header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; }
.edit-header h1 { margin: 0; }
.edit-layout { display: grid; gap: 24px; padding: 24px 40px 40px; }
.edit-row { display: grid; gap: 24px; align-items: stretch; }
.edit-row-top { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.edit-row-bottom { grid-template-columns: minmax(0, .55fr) minmax(0, 1.45fr); }
.edit-stack { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 24px; min-height: 100%; }
.edit-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-surface); }
.edit-card.finance-card { grid-column: auto; }
.edit-card .section-head { min-height: 40px; }
.edit-fields { display: grid; gap: 16px; padding: 24px; }
.edit-field { display: grid; gap: 6px; color: var(--muted); }
/* La carte « Action » porte huit champs : sur deux colonnes elle reste lisible
   sans allonger la modale. Intitule et Commentaire gardent la pleine largeur. */
.edit-fields-action { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; align-content: start; }
.edit-field-wide { grid-column: 1 / -1; }
.edit-field textarea { font: inherit; line-height: 1.5; resize: vertical; }
#editTitle { font-weight: 700; }
.public-picker { position: relative; }
.public-toggle { display: flex; align-items: center; justify-content: space-between; text-align: left; cursor: pointer; }
.public-toggle .icon { font-size: 14px; }
.public-picker.is-open .public-toggle .icon { transform: rotate(180deg); }
.public-options { display: none; position: absolute; z-index: 10; top: calc(100% + 2px); right: 0; left: 0; max-height: 210px; overflow: auto; padding: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 4px 12px var(--ft-color-background-opacity-dark-opacity); }
.public-picker.is-open .public-options { display: grid; gap: 6px; }
.readonly-value { min-height: var(--ft--form-control-height); color: var(--ink); font-size: 15px; }
.club-summary { display: grid; gap: 18px; color: var(--ink); font-size: 15px; line-height: 1.5; }
.club-summary strong { font-weight: 700; }
.agency-summary { display: grid; gap: 18px; color: var(--ink); font-size: 15px; line-height: 1.5; }
.agency-summary strong { font-weight: 700; }
/* Une ligne par statut, sur le modele du widget de reference : le controle de
   periode accompagne son statut au lieu d'occuper une cellule de grille. Les
   lignes non selectionnees n'ont donc que leur bouton et gardent toutes la
   meme hauteur, quelle que soit la hauteur du champ de periode affiche. */
.status-editor { display: grid; gap: 8px; }
.status-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.status-head-row .form-legend { margin-top: 0; }
.status-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
/* Le fond de selection vient de « with-checked-bg », qui le peint en teinte
   primaire sur le ::before du libelle. On garde sa mecanique et on ne remplace
   que la teinte, par le jeton semantique du statut : le reperage par couleur
   reste possible sans sortir de la palette du design system, et c'est la meme
   correspondance que celle de la pastille du tableau. */
.status-option { white-space: nowrap; }

/* Le fond va sur le conteneur, pas sur le ::before que peint le design system :
   celui-ci se superpose au texte, ce que sa teinte a 5 % rend sans consequence
   mais qu'une couleur franche masquerait. Le sien reste par-dessus, invisible. */
.status-options .form-check:has(.form-check-input:checked) { background-color: var(--statut-fond); border-radius: var(--ft--button-border-radius-sm); }
.status-options .form-check-input:checked + .form-check-label { color: var(--statut-encre); font-weight: 700; }

.status-option.projet { --statut-fond: var(--ft--bg-info); --statut-encre: var(--ft--icon-info); }
.status-option.planifie,
.status-option.planifiee { --statut-fond: var(--ft--bg-warning); --statut-encre: var(--ft--icon-warning); }
.status-option.a-confirmer { --statut-fond: var(--ft--bg-warning); --statut-encre: var(--ft--icon-warning); }
.status-option.realise,
.status-option.realisee { --statut-fond: var(--ft--bg-success); --statut-encre: var(--ft--icon-success); }
.status-option.annule,
.status-option.annulee { --statut-fond: var(--ft--bg-error); --statut-encre: var(--ft--icon-error); }
.status-period-slot { display: grid; gap: 6px; margin-top: 8px; }
.status-period-label { color: var(--muted); font-size: 12px; }
.status-period-label:empty { display: none; }
.status-period { min-width: 0; max-width: 280px; }
.status-period input { min-width: 0; }
.status-period ft-datepicker { display: block; width: 100%; }
.finance-summary { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.finance-summary strong { color: var(--ink); }
.finance-progress { width: 100px; }
.finance-progress .progress-bar { max-width: 100%; }
.finance-open { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding: 16px 24px 0; }
.finance-open .finance-budget { width: 120px; }
.finance-editor { padding: 24px; }
.finance-budget { display: grid; grid-template-rows: 24px var(--ft--form-control-height); row-gap: 10px; align-self: start; }
.finance-budget label { display: flex; align-items: center; white-space: nowrap; }
.finance-budget input { min-width: 0; margin: 0; }
.finance-list { display: grid; grid-template-rows: auto auto auto; row-gap: 10px; }
.finance-list-head > span { padding: 0 8px; line-height: 1.2; overflow-wrap: break-word; }
.finance-list-head { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 0.95fr) 62px; gap: 12px; align-items: end; min-height: 24px; color: var(--muted); }
.finance-list #financeRows { display: grid; gap: 10px; padding: 0; }
.finance-empty { display: flex; align-items: center; min-height: var(--ft--form-control-height); color: var(--muted); font-size: 14px; font-style: italic; }
.finance-list .finance-add { justify-self: start; }
/* Le statut de versement ne contient plus qu'un texte court : sa colonne laissait
   un grand vide avant le bouton Retirer. C'est cet espace qui revient au montant,
   jusqu'ici la colonne la plus etroite de la ligne. Le selecteur de financeur,
   lui, garde sa largeur. */
.finance-row { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 0.95fr) 62px; gap: 12px; min-height: var(--ft--form-control-height); align-items: center; }
.finance-row .finance-status { display: flex; align-items: center; min-height: var(--ft--form-control-height); padding: 6px 8px; color: var(--ink); }
.finance-row .form-control { min-width: 0; }
.edit-actions { display: flex; justify-content: flex-end; gap: 12px; padding: 0 40px 36px; }
.edit-message { padding: 10px 40px 0; color: var(--brand-red); font-weight: 700; }

.empty {
  padding: 28px;
  color: var(--muted);
}

.is-hidden { display: none; }
.status-period.is-hidden { display: none; }

/* La colonne de filtres et le tableau (980 px minimum) ne tiennent plus cote a
   cote sous ~1340 px : 24 + 270 + 24 + 980 + 24 = 1322 px, plus la barre de
   defilement de l'iframe. On rend alors sa largeur au tableau et on repartit les
   filtres sur autant de colonnes que la place le permet, chacune assez large
   pour son titre. */
@media (max-width: 1340px) {
  .dashboard-layout { grid-template-columns: minmax(0, 1fr); }
  .filters-body { grid-template-columns: repeat(auto-fit, minmax(var(--filter-col), 1fr)); }
}

@media (max-width: 900px) {
  .dashboard-layout { padding: 14px; }
  .topbar { align-items: flex-start; flex-direction: column; }
  .summary-top,
  .summary-charts { grid-template-columns: 1fr; }
  h1 { font-size: 22px; }
  .edit-layout { padding: 14px; }
  .edit-row-top,

  .edit-card.finance-card { grid-column: auto; }
  .finance-list-head { display: none; }
  .finance-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 62px; }
  .finance-row .finance-select { grid-column: 1 / -1; }
  .edit-header { align-items: flex-start; flex-direction: column; padding: 18px; }
  .edit-header-actions { width: 100%; justify-content: flex-end; }
  .edit-actions, .edit-message { padding-left: 14px; padding-right: 14px; }
}

/* Sur un ecran de telephone, les 100px de la colonne « Modifier » figee
   accapareraient un tiers de la largeur et recouvriraient la colonne Club. Elle
   redevient donc une colonne ordinaire, qui defile avec le reste du tableau.
   Le gel reste actif au-dessus de ce seuil, ou il est un gain. */
@media (max-width: 700px) {
  .table-panel thead th:last-child,
  .table-panel tbody td:last-child {
    position: static;
  }
}

    <script>
grist.ready({requiredAccess: 'full'});

const TABLES = ['Actions', 'Cofinancements', 'Agences', 'DD', 'DR', 'Structures', 'Dispositifs', 'Federations', 'Financements', 'Financeurs', 'Reponses_AAP'];
const COLORS = [
  '#283276',
  '#008ECF',
  '#F29FC5',
  '#FFE000',
  '#E1000F',
  '#8B4B8F',
  '#005B8F',
  '#D94F9D',
  '#7A6A00',
  '#8F0010',
  '#5F6BC4',
  '#00A6A6'
];
const FILTERS = [
  ['osiris', 'Numéro Osiris'],
  ['dr', 'Direction régionale (DR)'],
  ['dd', 'Direction départementale (DD)'],
  ['agency', 'Agence'],
  ['federation', 'Fédération'],
  ['club', 'Club'],
  ['dispositif', 'Dispositif'],
  ['statut', 'Statut'],
  ['financeur', 'Financeur'],
  ['financement', 'Financement']
];
// Filtres a liste deroulante avec recherche, filtres a saisie libre, et les
// trois etats de financement, qui sont calcules et non lus dans une colonne.
const SEARCHABLE_FILTERS = new Set(['agency', 'club', 'federation', 'dd']);
const TEXT_FILTERS = new Set(['osiris']);
const FINANCEMENT_STATES = ['100% financé', 'Partiellement financé', 'Non financé'];

const state = { raw: {}, actions: [], filters: {}, statusChoices: [], publicChoices: [], formatChoices: [], summaryOpen: false, filtersOpen: false, federationOthersOpen: false, sort: {}, view: 'dashboard', editingId: null };

document.getElementById('resetBtn').addEventListener('click', () => {
  state.filters = {};
  render();
});

document.getElementById('toggleSummary').addEventListener('click', () => {
  state.summaryOpen = !state.summaryOpen;
  render();
});

document.getElementById('toggleFilters').addEventListener('click', () => {
  state.filtersOpen = !state.filtersOpen;
  render();
});

document.getElementById('exportBtn').addEventListener('click', () => exportCsv(filteredActions()));

document.addEventListener('pointerdown', event => {
  if (event.target.closest('.filter-search-dropdown, .sort-menu')) return;
  document.querySelectorAll('.filter-search-dropdown[open], .sort-menu[open]').forEach(dropdown => dropdown.removeAttribute('open'));
});

document.querySelectorAll('[data-sort-option]').forEach(button => {
  button.addEventListener('click', event => {
    const key = event.currentTarget.dataset.sortOption;
    const direction = event.currentTarget.dataset.sortDirection;
    state.sort = direction ? {key, direction} : {};
    document.querySelectorAll('.sort-menu[open]').forEach(menu => menu.removeAttribute('open'));
    renderRows(filteredActions());
  });
});

load();

async function load() {
  try {
    const data = await Promise.all(TABLES.map(async table => {
      try {
        return [table, rows(await grist.docApi.fetchTable(table))];
      } catch (error) {
        console.warn(`Accès refusé ou table introuvable : ${table}`, error);
        return [table, []];
      }
    }));
    state.raw = Object.fromEntries(data);
    state.statusChoices = await loadColumnChoices('Actions', 'Statut');
    state.publicChoices = await loadColumnChoices('Actions', 'Public');
    state.formatChoices = await loadColumnChoices('Actions', 'Format');
    state.actions = buildActions(state.raw);
    render();
  } catch (error) {
    document.getElementById('rows').innerHTML = '';
    document.getElementById('empty').classList.remove('is-hidden');
    document.getElementById('empty').textContent = "Impossible de lire les tables Grist. Vérifiez que le widget a l'accès complet.";
    console.error(error);
  }
}

// Les listes de choix vivent dans la configuration des colonnes Grist. Trois
// chemins pour les lire, du plus fiable au dernier recours :
//   1. l'API REST /columns, qui ne demande que le droit de lecture de la table ;
//   2. les tables de métadonnées, refusées aux utilisateurs non propriétaires
//      dès qu'une règle d'accès retire la lecture par défaut (`-CRUD` sur `*`) ;
//   3. les listes ci-dessous, pour que personne ne se retrouve avec un menu vide.
const FALLBACK_CHOICES = {
  'Actions.Statut': ['A confirmer', 'Planifiée', 'Réalisée', 'Annulée'],
  'Actions.Public': ['BRSA', 'ZRR', 'QPV', 'Jeunes', 'Seniors', 'DELD', 'Infra Bac', 'DEBOE', 'Femmes', 'Hommes'],
  'Actions.Format': ['Demi-journée', 'Journée']
};

let accessTokenPromise = null;
const columnsCache = new Map();
let metaTablesPromise = null;

async function loadColumnChoices(tableId, colId) {
  const fromRest = await choicesFromRestApi(tableId, colId);
  if (fromRest.length) return fromRest;
  const fromMeta = await choicesFromMetaTables(tableId, colId);
  if (fromMeta.length) return fromMeta;
  console.warn(`Choix de ${tableId}.${colId} illisibles dans Grist : utilisation de la liste de secours.`);
  return FALLBACK_CHOICES[`${tableId}.${colId}`] || [];
}

async function choicesFromRestApi(tableId, colId) {
  const columns = await fetchTableColumns(tableId);
  const column = columns.find(item => item.id === colId);
  const options = parseWidgetOptions(column?.fields?.widgetOptions);
  return Array.isArray(options.choices) ? options.choices : [];
}

function fetchTableColumns(tableId) {
  if (!columnsCache.has(tableId)) {
    columnsCache.set(tableId, requestTableColumns(tableId).catch(error => {
      console.warn(`Impossible de lire les colonnes de ${tableId} via l'API REST`, error);
      return [];
    }));
  }
  return columnsCache.get(tableId);
}

async function requestTableColumns(tableId) {
  accessTokenPromise ||= grist.docApi.getAccessToken({readOnly: true});
  const {token, baseUrl} = await accessTokenPromise;
  const url = `${baseUrl}/tables/${encodeURIComponent(tableId)}/columns?auth=${encodeURIComponent(token)}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP ${response.status} sur ${tableId}/columns`);
  const payload = await response.json();
  return Array.isArray(payload.columns) ? payload.columns : [];
}

async function choicesFromMetaTables(tableId, colId) {
  try {
    metaTablesPromise ||= Promise.all([
      grist.docApi.fetchTable('_grist_Tables'),
      grist.docApi.fetchTable('_grist_Tables_column')
    ]);
    const [tables, columns] = await metaTablesPromise;
    const table = rows(tables).find(item => item.tableId === tableId);
    const column = rows(columns).find(item => item.parentId === table?.id && item.colId === colId);
    const options = parseWidgetOptions(column?.widgetOptions);
    return Array.isArray(options.choices) ? options.choices : [];
  } catch (error) {
    console.warn(`Impossible de lire les choix de ${tableId}.${colId} dans les métadonnées`, error);
    metaTablesPromise = null;
    return [];
  }
}

function parseWidgetOptions(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  try {
    return JSON.parse(value);
  } catch (error) {
    return {};
  }
}

function rows(table) {
  const ids = table.id || [];
  return ids.map((id, index) => {
    const row = {id};
    Object.keys(table).forEach(key => {
      if (key !== 'id') row[key] = table[key][index];
    });
    return row;
  });
}

function byId(items) {
  return new Map(items.map(item => [item.id, item]));
}

function buildActions(raw) {
  const actions = byId(raw.Actions);
  const agencies = byId(raw.Agences);
  const dds = byId(raw.DD);
  const drs = byId(raw.DR);
  const clubs = byId(raw.Structures);
  const dispositifs = byId(raw.Dispositifs);
  const federations = byId(raw.Federations);
  const reponses = byId(raw.Reponses_AAP);
  const financements = byId(raw.Financements);
  const financeurs = byId(raw.Financeurs);
  const cofs = raw.Cofinancements.reduce((acc, cof) => {
    const actionId = cof.Action;
    if (!actionId || !actions.has(actionId)) return acc;
    const financement = financements.get(cof.Financement) || {};
    const financeur = financeurs.get(financement.Financeur) || {};
    const label = financeur.Nom === 'France Travail' ? financement.Enveloppe : financeur.Nom;
    (acc[actionId] ||= []).push({...cof, label: label || 'Financeur', montant: Number(cof.Montant || 0), statutVersement: cof.Statut_Versement || ''});
    return acc;
  }, {});

  return raw.Actions.map(action => {
    const agency = agencies.get(action.Agence) || {};
    const dd = dds.get(agency.DD) || {};
    const dr = drs.get(dd.DR) || {};
    const club = clubs.get(action.Club) || {};
    const dispositif = dispositifs.get(action.Dispositif) || {};
    const federation = federations.get(action.Federation) || {};
    const reponse = reponses.get(action.Reponse_AAP) || {};
    const lines = cofs[action.id] || [];
    const financed = lines.reduce((sum, item) => sum + item.montant, 0);
    return {
      id: action.id,
      intitule: action.Intitule || '',
      // Formule Grist : numero Osiris suivi de l'intitule, ou l'intitule seul.
      nomComplet: action.Nom_complet || action.Intitule || '',
      osiris: reponse.Numero_Action_Osiris || '',
      budget: Number(action.Budget || 0),
      ouvertAuFinancement: action.Ouvert_au_financement === true,
      financed,
      rate: action.Budget ? financed / Number(action.Budget) : 0,
      financement: financementState(financed, Number(action.Budget || 0)),
      participants: Number(action.Jauge || 0),
      format: action.Format || '',
      lieu: action.Lieu || '',
      commentaire: action.Commentaire || '',
      public: formatChoiceList(action.Public),
      publicChoices: choiceValues(action.Public),
      statut: action.Statut || '',
      date: action.Date || null,
      periodeApprox: action.Periode_approx || '',
      clubId: action.Club || 0,
      agencyId: action.Agence || 0,
      dispositifId: action.Dispositif || 0,
      federationId: action.Federation || 0,
      agency: agency.Libelle_agence || agency.Code_Aurore || '',
      dd: dd.Nom || '',
      dr: dr.Nom || '',
      club: club.Nom || '',
      ville: action.Ville || '',
      dispositif: dispositif.Dispositif || dispositif.Code || '',
      federation: federation.Nom || '',
      financeurs: lines
    };
  });
}

function financementState(financed, budget) {
  if (budget > 0) {
    const rate = financed / budget;
    if (rate >= 1) return FINANCEMENT_STATES[0];
    return rate > 0 ? FINANCEMENT_STATES[1] : FINANCEMENT_STATES[2];
  }
  return financed > 0 ? FINANCEMENT_STATES[0] : FINANCEMENT_STATES[2];
}

// Le design system place le libelle d'un bouton dans un span dedie.
function buttonLabel(id, text) {
  const button = document.getElementById(id);
  (button.querySelector('.btn-content') || button).textContent = text;
}

function renderResults() {
  const actions = filteredActions();
  renderSummary(actions);
  renderRows(actions);
  requestResize();
}

function render() {
  renderFilters();
  const actions = filteredActions();
  renderSummary(actions);
  renderRows(actions);
  const editing = state.view === 'edit';
  document.getElementById('editView').classList.toggle('is-hidden', !editing);
  if (editing) renderEdit();
  requestResize();
}

function requestResize() {
  requestAnimationFrame(() => {
    if (window.grist && typeof grist.setHeight === 'function') {
      grist.setHeight(document.documentElement.scrollHeight);
    }
  });
}

function renderFilters() {
  const container = document.getElementById('filters');
  document.getElementById('filtersSection').classList.toggle('is-collapsed', !state.filtersOpen);
  document.getElementById('layout').classList.toggle('filters-collapsed', !state.filtersOpen);
  buttonLabel('toggleFilters', state.filtersOpen ? 'Replier' : 'Déplier');
  container.innerHTML = FILTERS.map(([key, label]) => {
    const selected = state.filters[key] || '';
    if (TEXT_FILTERS.has(key)) {
      return `<div class="filter-field">
        <label class="form-label" for="filter-${key}">${escapeHtml(label)}</label>
        <span class="filter-text-control">
          <input class="form-control filter-text-input" type="search" id="filter-${key}" name="filter-${key}" data-filter-text="${key}" value="${escapeAttr(selected)}" placeholder="Rechercher">
          <button class="btn btn-primary filter-text-submit" type="button" data-filter-submit="${key}" aria-label="Lancer la recherche par ${escapeAttr(label)}" title="Chercher">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M10.4 10.4 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </button>
        </span>
      </div>`;
    }
    const values = optionsFor(key);
    if (SEARCHABLE_FILTERS.has(key)) {
      return `<div class="filter-field">
        <span class="form-label" id="filter-${key}-label">${escapeHtml(label)}</span>
        <details class="filter-search-dropdown">
          <summary class="form-control" aria-labelledby="filter-${key}-label"><span>${escapeHtml(selected || 'Toutes / Tous')}</span><span class="icon icon-chevron-d" aria-hidden="true"></span></summary>
          <div class="filter-search-panel">
            <input class="form-control filter-search-input" type="search" data-filter-search="${key}" placeholder="Rechercher" aria-label="Rechercher ${escapeAttr(label)}">
            <div class="filter-search-options">
              <button class="filter-search-option" type="button" data-filter-key="${key}" data-filter-value="">Toutes / Tous</button>
              ${values.map(value => `<button class="filter-search-option" type="button" data-filter-key="${key}" data-filter-value="${escapeAttr(value)}" title="${escapeAttr(value)}">${escapeHtml(value)}</button>`).join('')}
            </div>
          </div>
        </details>
      </div>`;
    }
    return `<div class="filter-field">
      <label class="form-label" for="filter-${key}">${escapeHtml(label)}</label>
      <select class="form-control" id="filter-${key}" name="filter-${key}" data-filter="${key}">
        <option value="">Toutes / Tous</option>
        ${values.map(value => `<option value="${escapeAttr(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(value)}</option>`).join('')}
      </select>
    </div>`;
  }).join('');

  container.querySelectorAll('select').forEach(select => {
    select.addEventListener('change', event => {
      const key = event.target.dataset.filter;
      state.filters[key] = event.target.value;
      if (!state.filters[key]) delete state.filters[key];
      render();
    });
  });

  // Le tableau ne se recalcule qu'a la demande : sur des milliers d'actions, un
  // filtrage a chaque frappe fige la page. On ne reconstruit pas non plus les
  // filtres, pour que le champ garde son texte, son focus et son curseur.
  const applyTextFilter = key => {
    const input = container.querySelector(`[data-filter-text="${key}"]`);
    const value = input ? input.value.trim() : '';
    if (value) state.filters[key] = value;
    else delete state.filters[key];
    renderResults();
  };

  container.querySelectorAll('[data-filter-text]').forEach(input => {
    // L'evenement « search » couvre la touche Entree et la croix d'effacement
    // que le navigateur ajoute lui-meme au champ.
    input.addEventListener('search', () => applyTextFilter(input.dataset.filterText));
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        applyTextFilter(input.dataset.filterText);
      }
    });
  });

  container.querySelectorAll('[data-filter-submit]').forEach(button => {
    button.addEventListener('click', () => applyTextFilter(button.dataset.filterSubmit));
  });

  container.querySelectorAll('[data-filter-search]').forEach(input => {
    input.addEventListener('input', event => {
      const query = normalizeText(event.target.value);
      const key = event.target.dataset.filterSearch;
      container.querySelectorAll(`[data-filter-key="${key}"]`).forEach(option => {
        option.hidden = query && !normalizeText(option.dataset.filterValue).includes(query);
      });
    });
  });

  container.querySelectorAll('[data-filter-key]').forEach(option => {
    option.addEventListener('click', event => {
      const key = event.currentTarget.dataset.filterKey;
      const value = event.currentTarget.dataset.filterValue;
      if (value) state.filters[key] = value;
      else delete state.filters[key];
      render();
    });
  });
}

function optionsFor(key) {
  // Les trois etats de financement sont toujours proposes, dans cet ordre, meme
  // si aucune action de la selection courante ne s'y trouve.
  if (key === 'financement') return [...FINANCEMENT_STATES];
  const values = new Set();
  state.actions.forEach(action => {
    if (key === 'financeur') action.financeurs.forEach(item => item.label && values.add(item.label));
    else if (action[key]) values.add(action[key]);
  });
  return [...values].sort((a, b) => a.localeCompare(b, 'fr'));
}

function normalizeText(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase('fr');
}

function filteredActions() {
  const actions = state.actions.filter(action => Object.entries(state.filters).every(([key, value]) => {
    if (key === 'financeur') return action.financeurs.some(item => item.label === value);
    if (key === 'osiris') return normalizeText(action.osiris).includes(normalizeText(value));
    return action[key] === value;
  }));
  return sortActions(actions);
}

// <ft-datepicker> (widget officiel France Travail) n'expose pas de propriété
// .value fiable : sa valeur choisie n'arrive que via l'évènement personnalisé
// "ft-datepicker-input-change", donc on la garde dans data-iso-value plutôt
// que de la relire depuis l'élément. readPeriodValue()/writePeriodValue()
// centralisent cette différence face au simple <input type="text"> (Projet).
function bindDatePickers() {
  document.querySelectorAll('.edit-status-period[data-period-kind="date"]').forEach(picker => {
    picker.addEventListener('ft-datepicker-input-change', event => {
      const raw = event.detail && event.detail.value;
      picker.dataset.isoValue = raw ? frDateToIso(raw) : '';
    });
  });
}

function readPeriodValue(input) {
  return input.dataset.periodKind === 'date' ? (input.dataset.isoValue || '') : (input.value || '');
}

function writePeriodValue(input, value) {
  if (input.dataset.periodKind === 'date') {
    input.dataset.isoValue = value;
    input.setAttribute('value', isoToFrDate(value));
  } else {
    input.value = value;
  }
}

function referenceOptions(items, selectedId, labelFor, placeholder) {
  const selectable = [...items]
    .map(item => [item.id, labelFor(item)])
    .filter(([, label]) => label)
    .sort((a, b) => a[1].localeCompare(b[1], 'fr'));
  const options = selectable.map(([id, label]) =>
    `<option value="${id}"${id === selectedId ? ' selected' : ''}>${escapeHtml(label)}</option>`);
  // Sans reference, le navigateur afficherait la premiere option de la liste :
  // l'action paraitrait rattachee a une agence qu'elle n'a pas, et le simple fait
  // d'enregistrer la fiche l'y rattacherait pour de bon.
  if (!selectable.some(([id]) => id === selectedId)) {
    options.unshift(`<option value="" selected disabled>${escapeHtml(placeholder)}</option>`);
  }
  return options.join('');
}

// aria-modal ne suffit pas : une boite de dialogue doit aussi prendre le focus a
// l'ouverture, le retenir, et le rendre a son point de depart a la fermeture.
let dialogOpenFor = null;
let focusBeforeDialog = null;

const FOCUSABLE = 'a[href], button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), summary, [tabindex]:not([tabindex="-1"])';

function trapFocus(dialog) {
  if (dialogOpenFor !== state.editingId) {
    focusBeforeDialog = document.activeElement;
    dialogOpenFor = state.editingId;
    const first = dialog.querySelector('#editTitle') || dialog.querySelector(FOCUSABLE);
    if (first) first.focus();
  }
  dialog.onkeydown = event => {
    if (event.key !== 'Tab') return;
    const items = [...dialog.querySelectorAll(FOCUSABLE)].filter(item => item.offsetParent !== null);
    if (!items.length) return;
    const edge = event.shiftKey ? items[0] : items[items.length - 1];
    if (document.activeElement !== edge) return;
    event.preventDefault();
    (event.shiftKey ? items[items.length - 1] : items[0]).focus();
  };
}

function closeEdit() {
  state.view = 'dashboard';
  state.editingId = null;
  dialogOpenFor = null;
  render();
  // Le tableau vient d'etre reconstruit : on rend le focus a un element vivant.
  if (focusBeforeDialog && document.body.contains(focusBeforeDialog)) focusBeforeDialog.focus();
  else document.getElementById('exportBtn').focus();
  focusBeforeDialog = null;
}

async function saveEdit(event, action) {
  event.preventDefault();
  const message = document.getElementById('editMessage');
  const submit = document.getElementById('saveEdit');
  const publicValues = [...document.querySelectorAll('.public-choice:checked')].map(input => input.value);
  const rows = [...document.querySelectorAll('.finance-row')].map(row => ({
    id: Number(row.dataset.cofinancementId || 0),
    financement: Number(row.querySelector('.finance-select').value || 0),
    montant: Number(row.querySelector('.finance-amount').value || 0),
    statutVersement: row.querySelector('.finance-status').dataset.statut || ''
  })).filter(row => row.financement && row.montant >= 0);
  const status = document.querySelector('[name="editStatus"]:checked')?.value || '';
  const statusConfig = statusFieldConfig(status);
  const periodInput = document.querySelector('.status-period:not(.is-hidden) .edit-status-period');
  const periodValue = periodInput ? readPeriodValue(periodInput).trim() : '';
  const actionUpdate = {
    Intitule: document.getElementById('editTitle').value.trim(),
    Dispositif: Number(document.getElementById('editDispositif').value || 0),
    Jauge: Number(document.getElementById('editParticipants').value || 0),
    Format: document.getElementById('editFormat').value,
    Ville: document.getElementById('editVille').value.trim(),
    Lieu: document.getElementById('editLieu').value.trim(),
    Commentaire: document.getElementById('editCommentaire').value.trim(),
    Public: ['L', ...publicValues],
    Agence: Number(document.getElementById('editAgency').value || 0),
    Statut: status,
    Date: statusConfig.kind === 'date' && periodValue ? Math.floor(new Date(`${periodValue}T00:00:00`).getTime() / 1000) : null,
    Periode_approx: statusConfig.kind === 'text' ? periodValue : '',
    Budget: Number(document.getElementById('editBudget').value || 0),
    Ouvert_au_financement: document.getElementById('editOpenToFunding').checked
  };
  const currentIds = new Set(action.financeurs.map(item => item.id));
  const usedIds = new Set(rows.filter(row => row.id).map(row => row.id));
  const userActions = [['UpdateRecord', 'Actions', action.id, actionUpdate]];
  rows.forEach(row => {
    const fields = {Financement: row.financement, Montant: row.montant, Action: action.id, Statut_Versement: row.statutVersement};
    if (row.id && currentIds.has(row.id)) userActions.push(['UpdateRecord', 'Cofinancements', row.id, fields]);
    else userActions.push(['AddRecord', 'Cofinancements', null, fields]);
  });
  action.financeurs.filter(item => !usedIds.has(item.id)).forEach(item => userActions.push(['RemoveRecord', 'Cofinancements', item.id]));
  try {
    submit.disabled = true;
    message.classList.add('is-hidden');
    await grist.docApi.applyUserActions(userActions);
    state.view = 'dashboard';
    state.editingId = null;
    dialogOpenFor = null;
    await load();
  } catch (error) {
    const detail = String(error?.message || error || '').trim();
    message.textContent = detail
      ? `L'enregistrement n'a pas abouti : ${detail}`
      : "L'enregistrement n'a pas abouti. Vérifiez l'accès complet du widget puis réessayez.";
    message.classList.remove('is-hidden');
    submit.disabled = false;
    console.error(error);
  }
}

function pieBlock(title, entries) {
  const total = entries.reduce((sum, [, count]) => sum + count, 0) || 1;
  return `<div class="summary-block">
    <h2>${escapeHtml(title)}</h2>
    <div class="pie-wrap">
      ${pieSvg(entries, total)}
      <div class="legend">${entries.map(([name, count], index) => `
        <div class="legend-row">
          <span class="swatch" style="background:${colorForIndex(index)}"></span>
          <span>${escapeHtml(name || 'Non renseigné')}</span>
          <span class="count">${count} (${Math.round(count / total * 100)}%)</span>
        </div>
      `).join('')}</div>
    </div>
  </div>`;
}

function federationPieBlock(actions) {
  const allEntries = federationClubCounts(actions);
  const total = allEntries.reduce((sum, [, count]) => sum + count, 0) || 1;
  const topEntries = allEntries.slice(0, 10);
  const otherEntries = allEntries.slice(10);
  const chartEntries = otherEntries.length
    ? [...topEntries, ['Autres fédérations', otherEntries.reduce((sum, [, count]) => sum + count, 0)]]
    : topEntries;
  const otherCount = otherEntries.reduce((sum, [, count]) => sum + count, 0);
  const otherIndex = chartEntries.length - 1;

  return `<div class="summary-block">
    <h2>Répartition par fédération</h2>
    <div class="pie-wrap">
      ${pieSvg(chartEntries, total)}
      <div class="legend">
        ${topEntries.map(([name, count], index) => legendRow(name, count, total, colorForIndex(index))).join('')}
        ${otherEntries.length ? `
          <div class="federation-others">
            <button class="federation-others-toggle" id="toggleFederationOthers" type="button" aria-expanded="${state.federationOthersOpen}">
              <span class="swatch" style="background:${colorForIndex(otherIndex)}"></span>
              <span class="federation-others-name">Autres fédérations (${otherEntries.length})<span class="icon ${state.federationOthersOpen ? 'icon-chevron-u' : 'icon-chevron-d'}" aria-hidden="true"></span></span>
              <span class="count">${otherCount} ${otherCount > 1 ? 'clubs' : 'club'} (${Math.round(otherCount / total * 100)}%)</span>
            </button>
            ${state.federationOthersOpen ? `<div class="federation-others-details">
              ${otherEntries.map(([name, count]) => legendRow(name, count, total, colorForIndex(otherIndex), true)).join('')}
            </div>` : ''}
          </div>` : ''}
      </div>
    </div>
  </div>`;
}

function legendRow(name, count, total, color, nested = false) {
  return `<div class="legend-row${nested ? ' legend-row-nested' : ''}">
    <span class="swatch" style="background:${color}"></span>
    <span>${escapeHtml(name || 'Non renseigné')}</span>
    <span class="count">${count} (${Math.round(count / total * 100)}%)</span>
  </div>`;
}

function pieSvg(entries, total) {
  if (!entries.length) {
    return '<svg class="pie" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#ddd"></circle><circle cx="36" cy="36" r="34" fill="none" stroke="#fff" stroke-width="1.5"></circle></svg>';
  }
  if (entries.length === 1) {
    return `<svg class="pie" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="${colorForIndex(0)}"></circle><circle cx="36" cy="36" r="34" fill="none" stroke="#fff" stroke-width="1.5"></circle></svg>`;
  }
  let start = -90;
  const paths = entries.map(([, count], index) => {
    const angle = index === entries.length - 1 ? 270 : start + (count / total * 360);
    const path = sectorPath(36, 36, 34, start, angle);
    start = angle;
    return `<path d="${path}" fill="${colorForIndex(index)}"></path>`;
  }).join('');
  return `<svg class="pie" viewBox="0 0 72 72" aria-hidden="true">${paths}<circle cx="36" cy="36" r="34" fill="none" stroke="#fff" stroke-width="1.5"></circle></svg>`;
}

function colorForIndex(index) {
  if (index < COLORS.length) return COLORS[index];
  const hue = (index * 137.508) % 360;
  return `hsl(${Math.round(hue)} 58% 42%)`;
}

function sectorPath(cx, cy, radius, startAngle, endAngle) {
  const start = polarPoint(cx, cy, radius, endAngle);
  const end = polarPoint(cx, cy, radius, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

function polarPoint(cx, cy, radius, angle) {
  const radians = angle * Math.PI / 180;
  return {
    x: round(cx + radius * Math.cos(radians)),
    y: round(cy + radius * Math.sin(radians))
  };
}

function round(value) {
  return Math.round(value * 1000) / 1000;
}

function groupCount(actions, key, limit = 0) {
  const map = new Map();
  actions.forEach(action => map.set(action[key] || 'Non renseigné', (map.get(action[key] || 'Non renseigné') || 0) + 1));
  const entries = [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'fr'));
  if (!limit || entries.length <= limit) return entries;
  const visible = entries.slice(0, limit);
  const others = entries.slice(limit).reduce((sum, [, count]) => sum + count, 0);
  return [...visible, ['Autres fédérations', others]];
}

function federationClubCounts(actions) {
  const clubsByFederation = new Map();
  actions.forEach(action => {
    const federation = action.federation || 'Non renseigné';
    const club = action.clubId || action.club || action.id;
    if (!clubsByFederation.has(federation)) clubsByFederation.set(federation, new Set());
    clubsByFederation.get(federation).add(club);
  });
  return [...clubsByFederation.entries()]
    .map(([name, clubs]) => [name, clubs.size])
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'fr'));
}

function sortActions(actions) {
  const {key, direction} = state.sort;
  if (!key || !direction) return actions;
  const factor = direction === 'asc' ? 1 : -1;
  return [...actions].sort((a, b) => {
    const left = a[key];
    const right = b[key];
    if (typeof left === 'number' && typeof right === 'number') return factor * (left - right);
    return factor * String(left || '').localeCompare(String(right || ''), 'fr', {numeric: true});
  });
}

function funderTotals(actions) {
  const map = new Map();
  actions.forEach(action => action.financeurs.forEach(item => map.set(item.label, (map.get(item.label) || 0) + item.montant)));
  return [...map.entries()].sort((a, b) => b[1] - a[1]);
}

function statusClass(status) {
  return String(status)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

function statusFieldConfig(status) {
  const normalized = statusClass(status);
  if (normalized === 'projet' || normalized === 'a-confirmer') return {kind: 'text', label: 'Période de réalisation'};
  if (normalized === 'planifie' || normalized === 'planifiee') return {kind: 'date', label: 'Date de planification'};
  if (normalized === 'realise' || normalized === 'realisee') return {kind: 'date', label: 'Date de réalisation'};
  if (normalized === 'annule' || normalized === 'annulee') return {kind: 'none', label: ''};
  return {kind: 'date', label: 'Date'};
}

function statusPeriodControl(status, action) {
  const config = statusFieldConfig(status);
  const visible = status === action.statut;
  let input = '';
  if (config.kind === 'date') {
    const iso = dateInputValue(action.date);
    input = `<ft-datepicker class="edit-status-period" data-period-kind="date" data-iso-value="${escapeAttr(iso)}" value="${escapeAttr(isoToFrDate(iso))}"><span slot="label">${escapeHtml(config.label)}</span></ft-datepicker>`;
  } else if (config.kind === 'text') {
    input = `<input class="form-control edit-status-period" data-period-kind="text" type="text" value="${escapeAttr(action.periodeApprox)}">`;
  }
  return `<div class="status-period${visible ? '' : ' is-hidden'}" data-status-date="${escapeAttr(status)}">${input}</div>`;
}

function outerPeriodLabel(status) {
  const config = statusFieldConfig(status);
  return config.kind === 'text' ? config.label : '';
}

function statusPeriodValue(action) {
  const config = statusFieldConfig(action.statut);
  if (config.kind === 'text') return action.periodeApprox;
  if (config.kind === 'date') return formatDate(action.date);
  return '';
}

function formatEuro(value) {
  return `${Math.round(Number(value || 0)).toLocaleString('fr-FR')} €`;
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(Number(value) * 1000);
  return date.toLocaleDateString('fr-FR');
}

function withExistingValues(choices, values) {
  const extras = [...new Set(values.filter(value => value && !choices.includes(value)))].sort((a, b) => a.localeCompare(b, 'fr'));
  return [...choices, ...extras];
}

function formatChoiceList(value) {
  return choiceValues(value).join(', ');
}

function choiceValues(value) {
  if (!Array.isArray(value)) return value ? [String(value)] : [];
  return value[0] === 'L' ? value.slice(1) : value;
}

function dateInputValue(value) {
  if (!value) return '';
  const date = new Date(Number(value) * 1000);
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
}

// <ft-datepicker> attend/renvoie le format "JJ/MM/AAAA", le reste du widget
// travaille en "AAAA-MM-JJ" (comme <input type="date">).
function isoToFrDate(iso) {
  const m = String(iso || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
}

function frDateToIso(fr) {
  const m = String(fr || '').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}

function exportCsv(actions) {
  const header = ['Agence', 'DD', 'DR', 'Club', 'Fédération', 'Action', 'Dispositif', 'Participants', 'Public', 'Ville', 'Statut', 'Date', 'Budget', 'Montant cofinancé', 'Financeurs'];
  const lines = actions.map(action => [
    action.agency, action.dd, action.dr, action.club, action.federation, action.intitule, action.dispositif,
    action.participants, action.public, action.ville, action.statut, formatDate(action.date), Math.round(action.budget), Math.round(action.financed),
    action.financeurs.map(item => `${item.label}: ${Math.round(item.montant)}`).join(' | ')
  ]);
  const csv = [header, ...lines].map(row => row.map(cell => `"${String(cell ?? '').replaceAll('"', '""')}"`).join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'actions-insertion-sport.csv';
  link.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, '&#96;');
}
