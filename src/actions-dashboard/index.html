<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actions d'insertion par le sport</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link href="https://cdn.francetravail.fr/studio/design-system/css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="outil-agent">
    <div id="dashboardView">
      <div class="topbar">
        <h1>Actions d'insertion par le sport</h1>
        <button class="export" id="exportBtn">Exporter (CSV)</button>
      </div>

      <div class="layout">
        <aside class="filters">
          <div class="section-head">
            <span>Filtres</span>
            <button class="link-button" id="resetBtn">Réinitialiser</button>
          </div>
          <div class="filters-body" id="filters"></div>
        </aside>

        <main>
          <section class="section is-collapsed" id="summarySection">
            <div class="section-head">
              <span>Synthèse</span>
              <button class="link-button" id="toggleSummary">Déplier</button>
            </div>
            <div class="summary" id="summary"></div>
          </section>

          <section class="table">
            <table>
            <caption class="sr-only">Liste des actions d'insertion par le sport</caption>
            <colgroup>
              <col class="col-agency">
              <col class="col-club">
              <col class="col-action">
              <col class="col-status">
              <col class="col-finance">
              <col class="col-edit">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">Agence <select data-sort="agency" aria-label="Trier la colonne Agence"><option value="" aria-label="Aucun tri"></option><option value="asc">A-Z</option><option value="desc">Z-A</option></select></th>
                <th scope="col">Club <select data-sort="club" aria-label="Trier la colonne Club"><option value="" aria-label="Aucun tri"></option><option value="asc">A-Z</option><option value="desc">Z-A</option></select></th>
                <th scope="col">Action <select data-sort="intitule" aria-label="Trier la colonne Action"><option value="" aria-label="Aucun tri"></option><option value="asc">A-Z</option><option value="desc">Z-A</option></select></th>
                <th scope="col">Statut <select data-sort="statut" aria-label="Trier la colonne Statut"><option value="" aria-label="Aucun tri"></option><option value="asc">A-Z</option><option value="desc">Z-A</option></select></th>
                <th scope="col">Financement <select data-sort="budget" aria-label="Trier la colonne Financement"><option value="" aria-label="Aucun tri"></option><option value="asc">Croissant</option><option value="desc">Décroissant</option></select></th>
                <th aria-label="Modifier"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
            </table>
            <div class="empty is-hidden" id="empty">Aucune action ne correspond aux filtres.</div>
          </section>
        </main>
      </div>
    </div>

    <section class="edit-view is-hidden" id="editView"></section>

    <script src="script.js"></script>
  </body>
</html>
