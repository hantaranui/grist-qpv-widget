<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actions d'insertion par le sport</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link href="https://cdn.francetravail.fr/studio/design-system/css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="outil-agent">
    <div id="dashboardView">
      <div class="topbar">
        <h1>Actions d'insertion par le sport</h1>
        <button class="export" id="exportBtn">Exporter (CSV)</button>
      </div>

      <div class="layout">
        <aside class="filters">
          <div class="section-head">
            <span>Filtres</span>
            <button class="link-button" id="resetBtn">Réinitialiser</button>
          </div>
          <div class="filters-body" id="filters"></div>
        </aside>

        <main>
          <section class="section is-collapsed" id="summarySection">
            <div class="section-head">
              <span>Synthèse</span>
              <button class="link-button" id="toggleSummary">Déplier</button>
            </div>
            <div class="summary" id="summary"></div>
          </section>

          <section class="table">
            <table>
            <caption class="sr-only">Liste des actions d'insertion par le sport</caption>
            <colgroup>
              <col class="col-agency">
              <col class="col-club">
              <col class="col-action">
              <col class="col-status">
              <col class="col-finance">
              <col class="col-edit">
            </colgroup>
            <thead>
              <tr>
                <th scope="col"><details class="sort-menu"><summary aria-label="Trier la colonne Agence"><span>Agence</span><span class="icon icon-chevron-up-down" aria-hidden="true"></span></summary><div class="sort-options"><button type="button" data-sort-option="agency" data-sort-direction="asc"><span class="icon icon-arrow-up" aria-hidden="true"></span>A-Z</button><button type="button" data-sort-option="agency" data-sort-direction="desc"><span class="icon icon-arrow-down" aria-hidden="true"></span>Z-A</button></div></details></th>
                <th scope="col"><details class="sort-menu"><summary aria-label="Trier la colonne Club"><span>Club</span><span class="icon icon-chevron-up-down" aria-hidden="true"></span></summary><div class="sort-options"><button type="button" data-sort-option="club" data-sort-direction="asc"><span class="icon icon-arrow-up" aria-hidden="true"></span>A-Z</button><button type="button" data-sort-option="club" data-sort-direction="desc"><span class="icon icon-arrow-down" aria-hidden="true"></span>Z-A</button></div></details></th>
                <th scope="col"><details class="sort-menu"><summary aria-label="Trier la colonne Action"><span>Action</span><span class="icon icon-chevron-up-down" aria-hidden="true"></span></summary><div class="sort-options"><button type="button" data-sort-option="intitule" data-sort-direction="asc"><span class="icon icon-arrow-up" aria-hidden="true"></span>A-Z</button><button type="button" data-sort-option="intitule" data-sort-direction="desc"><span class="icon icon-arrow-down" aria-hidden="true"></span>Z-A</button></div></details></th>
                <th scope="col"><details class="sort-menu"><summary aria-label="Trier la colonne Statut"><span>Statut</span><span class="icon icon-chevron-up-down" aria-hidden="true"></span></summary><div class="sort-options"><button type="button" data-sort-option="statut" data-sort-direction="asc"><span class="icon icon-arrow-up" aria-hidden="true"></span>A-Z</button><button type="button" data-sort-option="statut" data-sort-direction="desc"><span class="icon icon-arrow-down" aria-hidden="true"></span>Z-A</button></div></details></th>
                <th scope="col"><details class="sort-menu"><summary aria-label="Trier la colonne Financement"><span>Financement</span><span class="icon icon-chevron-up-down" aria-hidden="true"></span></summary><div class="sort-options"><button type="button" data-sort-option="budget" data-sort-direction="asc"><span class="icon icon-arrow-up" aria-hidden="true"></span>Croissant</button><button type="button" data-sort-option="budget" data-sort-direction="desc"><span class="icon icon-arrow-down" aria-hidden="true"></span>Décroissant</button></div></details></th>
                <th aria-label="Modifier"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
            </table>
            <div class="empty is-hidden" id="empty">Aucune action ne correspond aux filtres.</div>
          </section>
        </main>
      </div>
    </div>

    <section class="edit-view is-hidden" id="editView"></section>

    <script src="script.js"></script>
  </body>
</html>
