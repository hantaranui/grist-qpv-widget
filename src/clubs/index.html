<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clubs</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://hantaranui.github.io/Bandeau_France-Travail/bandeau.js" data-titre="Liste des clubs sportifs"></script>
    <link href="https://cdn.francetravail.fr/studio/design-system/css/styles.css" rel="stylesheet">
    <script src="https://cdn.francetravail.fr/webco/v1/ft-autoloader.js" fetchpriority="high"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="outil-agent">
    <div id="listView">
      <div class="topbar">
        <h1>Clubs</h1>
        <!-- Export CSV (tâche E8-8) : un seul bouton qui ouvre un menu (composant Dropdown du
             design system) avec deux choix. Le bouton est grisé (aria-disabled) tant qu'aucun
             club n'est affiché ; script.js le met à jour à chaque affichage de la liste.
             Les lignes du menu sont des liens (structure du design system) : script.js annule
             la navigation au clic. -->
        <div class="topbar-actions">
          <div class="dropdown" id="exportDropdown">
            <button class="btn btn-secondary dropdown-toggle" data-ft-dropdown="exportMenu" type="button" id="exportMenuBtn" aria-disabled="true">
              <span class="btn-content">Exporter (CSV)</span>
              <span aria-hidden="true" class="icon icon-chevron-sm-d"></span>
            </button>

            <div id="exportMenu" class="dropdown-menu dropdown-md dropdown-menu-right">
              <ul class="dropdown-list">
                <li>
                  <a class="dropdown-item" href="#" id="exportClubsItem" data-export="clubs">Liste des clubs</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#" id="exportContactsItem" data-export="contacts" aria-describedby="exportContactsAide">Contacts</a>
                </li>
                <!-- Phrase d'explication de la ligne « Contacts » grisée : visible seulement
                     quand les contacts sont illisibles (script.js retire is-hidden). -->
                <li>
                  <p class="dropdown-item-text is-hidden" id="exportContactsAide">Vos droits ne permettent pas de lire les contacts.</p>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <section class="filters-bar">
        <div class="filters-body" id="filters"></div>
        <button class="btn btn-link btn-sm" type="button" id="resetBtn"><span class="btn-content">Réinitialiser les filtres</span></button>
      </section>

      <section class="table-panel">
        <table>
          <caption class="sr-only">Liste des clubs</caption>
          <colgroup>
            <col class="col-club">
            <col class="col-cp">
            <col class="col-ville">
            <col class="col-dd">
            <col class="col-dr">
            <col class="col-fed">
            <col class="col-voir">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Club</th>
              <th scope="col">Code postal</th>
              <th scope="col">Ville</th>
              <th scope="col">DD</th>
              <th scope="col">DR</th>
              <th scope="col">Fédération</th>
              <th aria-label="Voir la fiche"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty is-hidden" id="empty">Aucun club ne correspond aux filtres.</div>
      </section>
    </div>

    <section class="fiche-view is-hidden" id="ficheView"></section>

    <!-- Zone d'annonce pour les lecteurs d'écran (réussite d'un ajout, d'une
         modification ou d'une suppression de contact). Elle est ici, hors de la fiche, pour exister
         avant l'écriture du texte : la fiche est redessinée à chaque relecture. -->
    <p class="sr-only" id="contactStatus" role="status" aria-live="polite"></p>

    <!-- Zone d'annonce de l'export CSV (nombre de lignes exportées). Séparée de la zone des
         contacts pour que chacune garde son rôle ; elle existe dès le chargement de la page. -->
    <p class="sr-only" id="exportStatus" role="status" aria-live="polite"></p>

    <!-- Conteneur de la fenêtre d'ajout / modification / suppression d'un contact : vide tant
         que la fenêtre est fermée, hors de la fiche pour survivre à son rendu. -->
    <div id="contactModal"></div>

    <script src="script.js"></script>
  </body>
</html>
